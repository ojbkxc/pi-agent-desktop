name: Publish signed desktop release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pi-agent-desktop-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            apple_signing_identity: "-"
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu --bundles deb
            apple_signing_identity: ""
          # Restored after the file-tracer fix in eacaca3/7f2a1c0: a literal
          # homedir() reaching an fs call made @vercel/nft glob the whole
          # Windows profile at build time, which failed on its junction loops.
          # Verified through desktop:prepare by windows-build-debug.yml before
          # re-enabling; Tauri bundling and signing are first exercised here.
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
            apple_signing_identity: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out pi-agent-desktop
        uses: actions/checkout@v7

      - name: Require updater signing secrets
        shell: bash
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          test -n "$UPDATER_PRIVATE_KEY"
          test -n "$UPDATER_PUBLIC_KEY"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Configure updater public key
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/configure-updater-public-key.mjs

      # The window controls are drawn by the AppKit the binary links, not the
      # one it runs on: an SDK 15 build shows the legacy traffic lights even on
      # macOS 26+, and with different button geometry (0.7.1 shipped from a
      # macOS 15 runner that way). Fail here instead of shipping that again.
      - name: Require the macOS 26 SDK
        if: runner.os == 'macOS'
        run: |
          sdk="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK $sdk"
          test "${sdk%%.*}" -ge 26

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Verify bundled component releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run release:manifest
          npm run release:verify

      - name: Prepare packaged Next.js server
        run: npm run desktop:prepare

      - name: Test desktop shell
        if: runner.os == 'Windows' || runner.os == 'Linux'
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --lib --target ${{ matrix.target }}

      - name: Build, sign, and upload updater artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PI_AGENT_DESKTOP_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
        with:
          tagName: v__VERSION__
          releaseName: pi-agent-desktop v__VERSION__
          releaseBody: |
            ## Pi Agent Desktop 0.8.2 (fork)

            The **ojbkxc fork** of pi-agent-desktop, built on upstream 0.8.2. Same version number, re-published with the additions below.

            ### In this build

            - **Skill market.** A full page over two registries (ClawHub + SkillHub): search, source / security / install-state filters, a 13-category rail with counts, a bundled 398-skill curated snapshot (browsing works offline), skeleton cards, infinite scroll, detail with file preview, install safety checks and a "what this skill does" panel. Installs verify every file against the registry checksum and only ever write directories they can remove again.
            - **Agent Teams.** Your messages can ask for a team; teammates are real agents with the same built-in extensions a normal session gets (codemode / tool-search / MCP / LSP) plus a team mailbox, and a read-only teammate stays read-only through MCP. Workload is visible and assignable, teams can be stopped and reclaimed explicitly, and a plan needs your approval before members launch.
            - **Two test-case-generation skills are built in.** `generate-test-cases-skill` (requirement document → test-case XMind, with persistent memory) and `testcase-playbook` (10 design methods + flowchart node-coverage matrix + quality gates + Excel / XMind output). Usable in any project session, no install. Settings › Skills lists them as read-only **built-in**.
            - **Network proxy for session traffic** (Settings › General). Node's `fetch` ignores the system proxy, so before this a system proxy had no effect on model requests. Choose direct (default) / system / manual; it applies at once and covers the skill market and downloads too. The app's own update checks run in the desktop shell and are unaffected.
            - **Remote access.** Configurable listener port, a Cloudflare tunnel (quick or named, `cloudflared` pinned and SHA-256 verified), plus Tailscale and the end-to-end encrypted relay.
            - **Lean mode** (Settings › General): a project session loads no extensions, skills, prompt templates or context files, keeping only the built-in coding tools.

            ### Fixes

            - The composer's Agent Team switch used to jump to Settings when clicked — an old preference key was read with a new meaning. Migrated to a new key; the switch now arms one message, resets on send, and asks about cost once.
            - Two list APIs (market, skill search) answered with a single row when the page size was omitted: `Number(null)` is `0`, and `0` is finite, so a missing limit became a 1-row page.
            - A curated skill could read "at risk" in the list but "no risk found" on its detail page.
            - Reading a compacted session could answer HTTP 500 when a historical message carried no usage block.
            - Tool-result details the UI reads were stripped before reaching the browser; `entry_appended` reaches it again.

            Bundled components: pi 1.5.0, pi-web 0.10.0.

            ---

            ## Pi Agent Desktop 0.8.2（fork）

            这是 pi-agent-desktop 的 **ojbkxc fork**，基于上游 0.8.2 构建。版本号不变，随下列新增内容重新发布。

            ### 本版包含

            - **技能市场。** 整页浏览两个注册源（ClawHub + SkillHub）：搜索、来源 / 安全状态 / 安装状态三个筛选、13 类分类栏与计数、398 条精选离线快照、骨架卡片与滚动加载、详情含文件预览与「安装前请了解」能力面板。安装逐文件校验注册源校验和，且只写自己可再次删除的目录。
            - **Agent Teams。** 每条消息可选择用团队处理；成员是"真" agent，加载与普通会话同一批内置扩展（codemode / tool-search / MCP / LSP）外加团队邮箱，只读成员在 MCP 侧同样只读。忙闲可见并可一键调度，团队可显式停止与回收，计划需你批准后才派成员。
            - **内置两个测试用例生成技能。** `generate-test-cases-skill`（需求文档 → 测试用例 XMind，带持久化记忆）与 `testcase-playbook`（10 种设计方法 + 流程图节点覆盖矩阵 + 质量门禁 + Excel / XMind 输出）。任意项目会话开箱可用，无需安装；设置 › 技能 里显示为只读的**内置**。
            - **会话流量的网络代理**（设置 › 通用）。node 的 `fetch` 不读系统代理，所以在此之前系统代理对模型请求没有任何作用。可选 直连（默认）/ 跟随系统 / 手动；改完立即生效，技能市场与各类下载同样走它。应用自身的更新检查在桌面壳里，不受影响。
            - **远程访问。** 监听端口可配置、Cloudflare 隧道（快速或命名，`cloudflared` 固定版本 + SHA-256 校验），以及 Tailscale 与端到端加密中继。
            - **极简档**（设置 › 通用）：项目会话不加载扩展、技能、提示模板与上下文文件，只留内置编码工具。

            ### 修复

            - 聊天页的 Agent Team 开关曾点一下就跳设置 —— 旧偏好键被以新语义读取。已迁移到新键；开关现在只勾选本条消息，发送后复位，首次开启提示一次成本。
            - 两个列表接口在缺省分页大小时只回一行：`Number(null)` 是 `0`，而 `0` 是有限数，于是缺省被当成每页 1 条。
            - 精选技能可能在列表标「存在风险」、详情却显示「未发现风险」。
            - 读取被压缩过的会话时，历史消息缺 usage 字段会让状态接口 500。
            - 界面要读的工具结果字段曾被抹掉；`entry_appended` 重新送达浏览器。

            内置组件版本：pi 1.5.0、pi-web 0.10.0。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out pi-agent-desktop
        uses: actions/checkout@v7

      - name: Upload component manifest to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./src-tauri/pi-agent-desktop-package.json').version")"
          gh release upload "v$version" src-tauri/resources/component-versions.json --clobber
          # A prerelease is never served by the updater. Say so explicitly
          # instead of relying on the value tauri-action used when it first
          # created the draft (v0.7.3 ended up marked prerelease).
          gh release edit "v$version" --draft=false --latest --prerelease=false

  # A partially failed matrix leaves the release a draft and skips `manifest`,
  # which is correct — but it was also completely silent. Four consecutive
  # v0.1.3 builds failed on Windows without anyone noticing, and the release was
  # published by hand with macOS artifacts only and no component manifest.
  notify:
    needs: [build, manifest]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # This repository currently has Issues disabled, so an issue-only alert
      # silently fails and reports nothing — which is how four consecutive
      # failed releases went unnoticed. The job summary always works; the issue
      # is attempted on top and starts working by itself if Issues are enabled.
      - name: Report the failed release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "## Signed release build failed"
            echo
            echo "[Run log]($RUN_URL)"
            echo
            echo "The release for this version stays a **draft** and has no"
            echo "\`component-versions.json\`: the manifest job only runs when every"
            echo "platform in the build matrix succeeds."
            echo
            echo "**Do not publish it by hand.** A release missing a platform's installer"
            echo "or its component manifest will not serve updates to that platform —"
            echo "that is exactly how v0.1.3 shipped macOS-only."
          } >> "$GITHUB_STEP_SUMMARY"

          issues_enabled="$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues 2>/dev/null || echo false)"
          if [ "$issues_enabled" != "true" ]; then
            echo "Issues are disabled for $GITHUB_REPOSITORY; reported in the job summary only."
            echo "Enable Issues to also get a persistent, notifying alert." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --state open --label release-failure --limit 1 --json number --jq '.[0].number // empty')"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Release build failed again: $RUN_URL"
          else
            gh label create release-failure --repo "$GITHUB_REPOSITORY" \
              --color B60205 --description "Signed desktop release build needs attention" 2>/dev/null || true
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Signed release build failed" \
              --label release-failure \
              --body "The signed desktop release build failed: $RUN_URL

          The release for this version stays a DRAFT and has no component-versions.json,
          because the manifest job only runs when every platform in the build matrix
          succeeds. Do not publish it by hand — a release missing a platform's installer
          or its component manifest will not serve updates to that platform.

          This issue is reused for subsequent failures; close it once a release is green."
          fi

  # Keeps Casks/pi-agent.rb (the Homebrew tap: `brew tap abcwyc/pi-agent-desktop
  # https://github.com/abcwyc/pi-agent-desktop`) on the release that was just
  # published. Runs only after `manifest` has published it, so a draft or partly
  # failed release never reaches Homebrew users. Placed after `notify` because
  # release-workflows.test.mjs slices the manifest job up to `notify:`.
  homebrew:
    needs: manifest
    # The cask lives in the upstream's own Homebrew tap: its url/homepage point at
    # abcwyc/pi-agent-desktop, so a fork running this job would rewrite
    # Casks/pi-agent.rb to a version the upstream has never released and then push
    # that broken cask to main.
    if: github.repository == 'abcwyc/pi-agent-desktop'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pi-agent-desktop
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Point the cask at the published DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./src-tauri/pi-agent-desktop-package.json').version")"
          digest="$(gh release view "v$version" --json assets \
            --jq '.assets[] | select(.name | endswith("_aarch64.dmg")) | .digest')"
          if [ -z "$digest" ]; then
            echo "No aarch64 DMG digest on release v$version" >&2
            exit 1
          fi
          node scripts/update-homebrew-cask.mjs "$version" "$digest"
          if git diff --quiet -- Casks; then
            echo "Cask already at $version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/pi-agent.rb
          git commit -m "chore(homebrew): update cask to $version"
          git push origin HEAD:main
