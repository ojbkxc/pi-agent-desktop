name: Publish signed desktop release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pi-agent-desktop-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            apple_signing_identity: "-"
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu --bundles deb
            apple_signing_identity: ""
          # Restored after the file-tracer fix in eacaca3/7f2a1c0: a literal
          # homedir() reaching an fs call made @vercel/nft glob the whole
          # Windows profile at build time, which failed on its junction loops.
          # Verified through desktop:prepare by windows-build-debug.yml before
          # re-enabling; Tauri bundling and signing are first exercised here.
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
            apple_signing_identity: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out pi-agent-desktop
        uses: actions/checkout@v7

      - name: Require updater signing secrets
        shell: bash
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          test -n "$UPDATER_PRIVATE_KEY"
          test -n "$UPDATER_PUBLIC_KEY"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Configure updater public key
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/configure-updater-public-key.mjs

      # The window controls are drawn by the AppKit the binary links, not the
      # one it runs on: an SDK 15 build shows the legacy traffic lights even on
      # macOS 26+, and with different button geometry (0.7.1 shipped from a
      # macOS 15 runner that way). Fail here instead of shipping that again.
      - name: Require the macOS 26 SDK
        if: runner.os == 'macOS'
        run: |
          sdk="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK $sdk"
          test "${sdk%%.*}" -ge 26

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Verify bundled component releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # 同号覆盖重发（本次口径）：跳过「必须比最新 Release 新」的闸门，
          # tauri-action 复用/移动已存在的 v0.8.7 tag。普通发版不要设它。
          PI_OVERWRITE_RELEASE: "1"
        run: |
          npm run release:manifest
          npm run release:verify

      - name: Prepare packaged Next.js server
        run: npm run desktop:prepare

      - name: Test desktop shell
        if: runner.os == 'Windows' || runner.os == 'Linux'
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --lib --target ${{ matrix.target }}

      - name: Build, sign, and upload updater artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PI_AGENT_DESKTOP_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
        with:
          tagName: v__VERSION__
          releaseName: pi-agent-desktop v__VERSION__
          releaseBody: |
            ## Pi Agent Desktop 0.8.7 (fork)

            **2026-11-23 · 覆盖式重发（第十一次）**

            > 版本号保持 0.8.7 不变，本次构建替换上一版的全部安装包。升级方式与普通更新相同，直接覆盖安装即可；配置、会话与任务记录都在 `~/.pi/agent/`，不受影响。

            本 fork 基于上游 pi-agent-desktop 0.8.2 / pi-web 0.10 构建，已并入上游 pi-web **v0.10 → v0.17** 的全部安全、稳定性与性能修复，并在此之上维护本 fork 的桌面功能线。

            本次是第十一次覆盖重发，修复 6 个已证实缺陷（1 个 P1、3 个 P2），全部带回归测试。

            ### 本次重发新增：缺陷修复 / Fixes in this re-release

            - **后台命令 / background-jobs (P1).** Windows 上没有 Git Bash 的机器（Git 装在 D 盘、只装了 MSYS2、干净装机）此前**每一条后台任务都直接失败**（`No bash shell found`）；现在三级兜底（SDK 探测 → 仓库终端探测 → PowerShell），降级只提示一次不静默，旧版 WSL bash 的 stdin 传输路径一并补上。
            - **破甲 / purge (P2).** 「降低思考档位」此前只压不还，一轮跑完会话被永久留在低档位、关掉开关也不回升（「关闭=纯转发」失效）；现改为运行结束自动还原，操作者中途手动改过档位则尊重手动选择。「写入技能文件」此前把预设标题写进 frontmatter `name`，而 53 条预设里 33 条标题不是合法技能名；现改为写规范 id（标题保留在 description），落盘改原子写。
            - **API 健壮性 / API hardening (P2).** autopilot、lean-mode、network-proxy、pinned-sessions、relay、terminal、skills、open-in-explorer 八条写路由此前把非法 JSON 报成 500 并回显解析器原文；现在统一返回 400 与通用文案，open-in-explorer 顺带补上缺失的 Content-Type 闸门。
            - **已知未修 / known gaps.** dsh-purge 适配缺口四项（boost 强化段、refusal-retry、技能归档导入、上游 agent 预设正文提炼）维持现状，判定与证据见 `docs/agents/purge-adaptation-audit.md`。

            ### 第十次重发内容 / Fixes in the previous re-release

            - **安全 / security.** models-config 的模型发现与测试不再把本机存储的 API 凭据发往请求指定的新 Base URL；未保存的私网/环回目标（含 IPv4 与 IPv6-mapped）一律拒绝，已保存的本地 provider（Ollama 等）仍然放行。远端读取网络代理配置时遮蔽 `user:pass@`。
            - **团队 / teams.** 「暂停」按钮现在真正调用服务端 pause（此前只 abort lead）；lifecycle 请求加 15s 超时，挂起后按钮不再永久禁用。
            - **无人值守 / unattended.** campaign 会话的阻塞对话框纳入 120s 安全默认（不扩大团队计划自动批准的范围）。
            - **对话 / chat.** `/name` 后正确提升新建会话（草稿 rekey 与 AppShell 通知恢复）。
            - **API 健壮性 / API hardening.** scheduled-tasks、memory、autofix 的非法 JSON 返回 400 而非 500；pinned-sessions 与 background-jobs 写路由补来源校验。
            - **界面 / UI.** Autofix/Campaign 的工作目录清空后不再被默认值回填；cron 预览失败显示错误并可重试（保存仍要求校验通过）。
            - **已知未修 / known gaps.** chatWorkspace 并发启动的双 wrapper 竞态（需并行请求才可达）；campaign 运行中成本累计与跨天间隔（P2/P3 设计占位）。

            ### 一、本次新增 / What's new

            #### 1. 长时自主「项目战役」P1 / Project campaigns (P1)

            告诉它一个 git 仓库和一组待办项，它自己排队做完；每一项都必须通过你配置的验证命令。

            - **逐项推进，判据在引擎侧。** 每个待办项包含指令与验收条件；agent 在独立会话中执行，每轮结束后由引擎运行 `verifyCommand`，**退出码 0 才算完成**，否则把失败输出回喂到下一轮继续修。
            - **有界执行。** 单项轮数、战役总轮数、总成本都有上限，触顶即停，不会无限烧钱。
            - **创建即硬闸。** 必须提供 git 工作目录、正数的 `maxTotalCostUsd`、以及非 `off` 的命令审批档；不满足直接返回 400，不落盘。
            - **可恢复。** 进度原子写入 `<agent dir>/campaigns/<uuid>.json`；进程重启后从第 K 项续跑，而不是从头再来。
            - **Provider 中断不计轮次。** 与自动修 Bug 共用中断账本，新增 `campaign` 作用域，由战役自己的 sweep 续跑；通用中断调度器只读不抢，避免双驱动。
            - **可控。** 页面提供 stop / pause / resume / delete，逐项状态、日志与成本可见。

            > **P1 边界（重要）**：这是 MVP。跨天间隔（`intervalMs` 已进数据模型与校验，UI 暂不暴露）、git checkpoint、运行中成本闸、多 worker 均尚未实现；P1 默认背靠背连续执行。

            #### 2. 命令审批档位切换 / Command-approval switch

            聊天输入框底栏、模型选择器右侧新增紧凑指示器，点击循环切换：

            `全权限（off，默认）→ 仅危险命令 → 全部命令 → 全权限`

            - **全权限**：不拦截任何 shell 命令、零提示；切到这一档静默直接保存（等价 cc-haha 的 bypassPermissions）。
            - **仅危险命令**：只对命中危险规则（`rm -rf`、强制推送、`DROP TABLE` 等）的命令要求确认。
            - **全部命令**：每条 shell 命令都先确认；进入这一档前弹一次确认，取消不改档位。
            - 读取与保存只走既有 `GET/PUT /api/tool-approval`，判定始终在服务端；保存失败保持原档位并提示；非本机（隧道/远端）置灰只读，不发写请求。
            - 按钮带 `aria-label`，档位变化用 `aria-live` 播报；三语文案统一。

            #### 3. 破甲控制台 / Purge console

            - **默认开启。** 总闸 `enabled` 与「按模型自动套用」都默认打开，新装即按当前会话模型套用对应预设；关掉总闸仍是逐字节纯转发（不判定、不重写、不改一个字）。
            - **按模型自动套用。** 请求发出前按会话模型在 53 条内置预设里查一次，命中就把预设正文原样拼在系统提示词之前或之后。`exact` 只认同名模型，`vendor` 才退到同厂商；也可以固定某条预设 id。拿不到模型或未命中就什么都不套。
            - **设置面板。** 新增「按模型自动套用」一节：开关、前后位置、匹配强度、固定 id，以及「默认模型 X → 将套用 Y」的实时预览；命中次数进入只读统计。
            - **性能。** 设置读取改为 mtime+size 缓存（工具循环每轮不再全量读盘+解析）；治理改写单次扫描并按规则缓存正则，输出逐字节等价；模型只归一化一次，53 条预设的归一化结果按行缓存；`GET /api/purge` 补上与其余读接口一致的 Host/Origin 门。
            - **闸门归属。** 新增只读面板，展示各闸门 allowed/denied 计数与最近事件，补齐 `/api/purge/gate-log` 的前端消费；移除冗余的 `/api/purge/active-model` 路由。

            #### 4. 后台命令可见可停 / Background commands

            - Tasks 页新增后台命令列表（运行中 / 近期）与停止按钮，补上 `GET /api/background-jobs` 此前没有前端消费的缺口。
            - 底层能力回顾：`bash_background` 立即返回 job id，长构建、测试套件、dev server 不再阻塞对话；输出落盘 8 MB 封顶，完成时只把尾部 4 KB 作为新消息注入；重启后按记录结算，不会停留在「仍在运行」；停止会杀整个进程树；与 `bash` 受同一套命令审批约束。

            ### 二、本版同时包含的能力 / Also in this build

            #### 安全（上游 v0.10 → v0.17 移植）

            - **preview 模式绕过已封堵。** 每个发行版都带同一个 `previewModeId`，请求头 `x-prerender-revalidate` 与之相等时 Next 会跳过 `proxy.ts`，即绕过 Web 密码门与 Host/Origin 校验（腾讯玄武实验室报告）。npm CLI 启动时轮换三个 preview 密钥；桌面启动器在 Next 之前剥掉两个 revalidate 请求头，并在每次启动时把密钥重写为新的随机值。
            - **PowerShell 与 bash 同口径消毒。** PowerShell stand-in 剥离 `PORT`、`NODE_ENV`、`NEXT_*`、`PI_WEB_PASSWORD`、`PI_DESKTOP_API_TOKEN`，只在被点名时激活；bash stand-in 同样改为显式激活。
            - **npx 不再继承主机密钥。** 技能安装、搜索、更新在运行第三方 npm 代码前剥离主机环境变量。
            - **信任链归于正确的会话。** 子代理会话按父会话决定项目信任（只读一次，不写 `trust.json`）；恢复的会话按自身目录决定；未信任目录里的子代理 profile 不出现；未信任仓库的 `enabledModels` 不再遮蔽全局列表。
            - **文件边界更紧。** git/diff 端点逐级 `lstat`（防 junction 逃逸）；上传走同盘暂存、两次拒符号链接、原子替换；无界后缀 Range 返回 416；MIME 查表只认自有属性；桌面 popup 按 nonce 清理；代理凭据不随环境变量泄漏；技能市场外链只渲染 `http(s)`。

            #### 稳定性

            - `session_start` 弹对话框的会话现在能正常启动，不再在首轮之前死锁。
            - 登录流断线不崩；设备码 SSE 流对已关闭的 controller 加了守卫；pi SDK 在启动时预导入；ChatGPT OAuth 的 device id 修正。
            - Code mode 不因一次启动卡顿被整个进程关掉。
            - 补齐剩余的在途回合失效路径守卫，快速切换会话不会把旧回复写进新对话。
            - 隧道探针固定直连，与 `cloudflared` 自身的出网路径一致 —— 手动代理坏掉时不会再被误判成「隧道坏了」。

            #### 性能

            - **流式只重渲染回复本身。** 流式状态移出 React：每个 chunk 只重渲染 `StreamingReply`；整段流就是一个代码围栏时完全跳过 markdown 解析器。
            - **会话列表只重扫文件尾部**，不再从文件头读起。
            - **provider 签名不再下发浏览器**，长会话载荷更小。
            - **共享 model runtime。** provider 与扩展目录只加载一次（带 TTL），不再按请求重建。

            #### 桌面与团队

            - **自动修 Bug。** 给一句话，专用会话改代码；每轮结束后由引擎跑项目验证命令（test → typecheck → check → lint，无可探测判据的任务直接拒绝）。退出码 0 是唯一成功；失败输出回喂下一轮；轮数上限默认 20；进度原子落盘，重启可续。
            - **常驻会话与 router 角色。** 常驻（pin）会话豁免 10 分钟空闲卸载；标记为 `router` 的会话会收到「把工作派给后台 worker、汇总回执而不是自己动手」的分派提示。侧栏分区 + 设置 › 通用 › 常驻。
            - **Provider 中断自愈。** 模型 API 数分钟到数小时不可达时，会话挂起等待，恢复后自动续跑；退避 30s → 1m → 2m → 5m → 10m → 20m → 30m（带抖动），双闸 40 次 / 6 小时（配额错误 24 小时），配额错误从 5 分钟起试。
            - **长期记忆。** 偏好与事实存于 `~/.pi/agent/pi-web/memory.json`（200 条、每条 4 KB），注入最近 30 条；模型可经 `memory` 工具写入，设置页可编辑。
            - **「Needs you」收件箱。** 停在提问或审批上的会话置顶显示，手机首页也能看到谁在等你、谁已完成；完成的运行可推送通知，并可关闭推送。
            - **纯密码登录。** 去掉用户名（包括浏览器 Basic-auth 弹窗）；未设置密码时 `/login` 兼作首次设置页。
            - **团队模型自动切换。** 成员所用 provider 开始失败（上游 5xx、连接中断、配额耗尽）且团队还有可用模型时，自动换到另一个模型继续；优先跨 provider，已试过的模型不重试；切换两次后通知 lead。代码错误、鉴权失败、模型不存在不触发切换。
            - **`/goal` 与目标面板。** 团队按钮旁一键插入 `/goal `；目标按钮打开 Alma 式面板：可验证的完成条件、重复计划（5m / 2h / 1d，7 天封顶），每轮结束由一个**独立模型**核对条件，工作模型不能自判完成。
            - **Cloudflare 隧道。** 命名隧道在登记后自动绑定固定域名，无需重启；cloudflared 忽略 `HTTPS_PROXY`，因此经回环代理桥接出网，验证探针走同一条路径；连接诊断记录每次启动的阶段/结果/耗时，并对隧道 token 与代理凭据脱敏。
            - **手机配对。** 电脑上的二维码把一次性密钥（5 分钟）交给手机；批准后签发按设备区分的 token（仅存 SHA-256、`__Host-` cookie、30 天有效、可随时撤销）。Web 密码仍然可用。
            - **计划弹框与计划控制。** 「查看配置」弹框与聊天输入框等宽（容器查询断点，窄窗不再横跨屏幕）；有父计划的计划卡新增 Stop，RuntimeControls 支持 pause / resume 与逐成员模型 / 思考档位编辑（运行中的成员拒绝编辑，返回 409）。
            - **界面细节。** cc-haha 风格的工具调用聚合行（默认收起、回合尾动词摘要）、团队状态条移至消息列上方整宽横幅、上下文环方形用量面板（含真实压缩触发点与立即压缩）、压缩阈值回归档位占比（均衡 50% / 长上下文 80%）、团队会话标题剥离 `<agent-team-request>`、团队模型下拉修复、配置横条单行短版、泳道连线终点锚定收件方。
            - **独立渲染器。** SVG 围栏像 Mermaid 一样预览（仅 `<img>`，源码不进 DOM）、内联音视频播放、显示公式复制 LaTeX、编辑前 diff 预览、结构化工具参数行、每轮耗时、CSV/TSV 虚拟化表格。

            #### 修复与无障碍

            - **技能市场六项。** 已安装页不再因最小元数据崩溃；筛选切换后无限滚动不再卡住；429 不再被记为健康；安装与卸载共用 owner 锁；文件预览同时校验 `path` 形状与技能文件清单；压缩模型选项只列已存凭据。
            - **团队。** Stop / reclaim / ended / quota 覆盖仅存于计划的成员；坏 `plan.json` 返回 400 并说明原因，而不是「还没有计划」；重发会校验任务状态，不再重复投递；失败的 `team_create` 不再记到 lead 会话头上。
            - **MCP 登录适配 pi 1.5.2**，项目信任跟随 pi 1.5 语义。
            - **安装包不再携带本机配置或凭据。** 打包前清空载荷、裁剪 `.pi/`，并对任何 `.pi/` 路径、`Bearer ak_` token、PGP armored 私钥或构建残留做 fail-closed 扫描，没有跳过开关。
            - **输入框双提交。** 仍在解析 `#` 引用的提交不会触发第二次；慢响应不会清掉等待期间输入的文本。
            - **无障碍与布局。** 关闭的面板退出 Tab 序（`inert`）；粗指针设备 44 px 点击区；CJK 会话时间不再压住标题；添加提供商选择器留在对话框内；项目菜单改为滚动；模型发现按目录分页（重复游标与分页后失败返回 502）。
            - **计时器与竞态。** 团队轮询判死定时器、通知 store 单句柄覆盖、9 处复制提示计时器互踩；`/goal` 与团队条不再每条消息闪空；文件查看器增量失败保留已加载内容。
            - **测试。** 恒真断言改为跨行 `assert.match`，并做真·反向复现（删源码行才红）。

            ### 三、组件与升级 / Components and upgrade

            - **组件**：pi 1.5.2、pi-web 0.10.0（本 fork 固定底座，上游 v0.10 → v0.17 的改动已移植）、Next.js 16.4.4、undici 8.12.3。
            - **依赖**：8 个 `@earendil-works/*` 包精确锁定；`npm audit --omit=dev` 零漏洞。
            - **升级**：安装本次构建覆盖旧版即可；配置、会话、任务与记忆均保存在 `~/.pi/agent/`，升级不丢。

            > 历史版本的发布说明见下方。

            ---

            以下为历史发布说明（更早的版本）。

            ## Pi Agent Desktop 0.8.6（fork）

            这是 pi-agent-desktop 的 **ojbkxc fork**，基于上游 0.8.2 构建。本版包含：上游 pi-web v0.10 至 v0.17 的安全 / 稳定性 / 性能吸收、pi SDK 1.5.2 / Next.js 16.4.4 / undici 8.12.3 升级，以及本 fork 的新增功能。

            ### 安全（上游 v0.10 → v0.17 移植）

            - **preview 模式绕过已封堵。** 每个发行版都带同一个 `previewModeId`，请求头 `x-prerender-revalidate` 与之相等时 Next 会跳过 `proxy.ts` —— 即绕过 web 密码门与 Host/Origin 校验（腾讯玄武实验室报告）。npm CLI 启动时轮换三个 preview 密钥；桌面启动器在 Next 之前剥掉两个 revalidate 请求头，并在每次启动时把密钥重写为新的随机值，因此即使剥头被绕过，发行版里的旧值也已失效。
            - **PowerShell 与 bash 同口径消毒。** PowerShell stand-in 会剥离 `PORT`、`NODE_ENV`、`NEXT_*`、`PI_WEB_PASSWORD`、`PI_DESKTOP_API_TOKEN`，只在被点名时激活，也不再顶掉用户扩展；bash stand-in 同样改为显式激活。
            - **npx 不再继承主机密钥。** 技能安装 / 搜索 / 更新在运行第三方 npm 代码前剥离主机环境变量。
            - **信任链归于正确的会话。** 子代理会话按父会话决定项目信任（只读一次，不写 trust.json），恢复的会话按自身目录决定，未信任目录里的子代理 profile 不再出现，未信任仓库的 `enabledModels` 也不再遮蔽全局列表。
            - **文件边界更紧。** git/diff 端点逐级 `lstat`（防 junction 逃逸）；上传走同盘暂存、两次拒符号链接、原子替换；无界后缀 Range 返回 416；MIME 查表只认自有属性。桌面 popup 按 nonce 清理，代理凭据不再随环境变量泄漏给子进程，技能市场外链只渲染 `http(s)`。

            ### 稳定性

            - **`session_start` 弹对话框的会话现在能正常启动**，不再在首轮之前死锁。
            - **登录流断线不崩。** 设备码 SSE 流对已关闭的 controller 加了守卫，pi SDK 在启动时预导入，ChatGPT OAuth 的 device id 修正。
            - **Code mode 不因一次启动卡顿被整个进程关掉。**
            - **补齐剩余的在途回合失效路径守卫**，快速切换会话不会把旧回复写进新对话。
            - **隧道探针固定直连**，与 `cloudflared` 自身的出网路径一致 —— 手动代理坏掉时不会再被误判成「隧道坏了」而拆掉一条本来通的隧道。

            ### 性能

            - **流式只重渲染回复本身。** 流式状态移出 React：每个 chunk 只重渲染 `StreamingReply`，不再带动整个窗口；整段流就是一个代码围栏时完全跳过 markdown 解析器。
            - **会话列表只重扫文件尾部**，不再从文件头读起。
            - **provider 签名不再下发浏览器**，长会话载荷更小。
            - **共享 model runtime。** provider 与扩展目录只加载一次（带 TTL），不再按 provider / skills 请求重建。

            ### 依赖

            - pi SDK **1.5.2**（8 个 `@earendil-works/*` 包精确锁）、Next.js **16.4.4**、undici **8.12.3**（修复 9 个安全通告）。`npm audit --omit=dev` 零漏洞。

            ### 新增

            - **自动修 Bug。** 给一句话任务说明：独立会话改代码，每轮回合结束后由引擎自己跑项目的验证命令（test → typecheck → check → lint，没有判据的任务拒绝启动）。exit 0 才算成功；失败输出喂回下一轮，轮次上限默认 20，进度原子落盘，重启后自动接续。
            - **挂机保活。** 15 秒心跳、按 pid 活性接续中断的会话（pid 还活着就永不判为孤儿），跨平台守护脚本（`scripts/pi-supervisor.mjs`：Windows 计划任务 / launchd / systemd user timer），重启预算 5 次/小时，断网时只等待不重启。设置 › 通用 › 挂机保活。
            - **Cloudflare 命名隧道绑定固定域名。** 注册后轮询 cloudflared 推送的 ingress 规则；自定义域名指向本机网关即自动绑定，无需重启隧道；固定公网地址可复制 / 打开。公网校验按 0 / 2 / 4 / 8 / 15 秒节奏重试，预算 45 秒。
            - **web 密码可存于设置。** 除 `PI_WEB_PASSWORD`（仍然优先）外，密码也能以 scrypt 哈希存进 0600 文件，绝不明文。改密即轮换会话令牌，旧会话全部失效。设置 › 通用 › 服务器。
            - **cc-haha 计划控制。** 带 parentPlan 的计划卡显示停止按钮；RuntimeControls 增加暂停 / 恢复与成员模型、推理级别编辑（运行中的成员改配置返回 409）。
            - **后台命令。** `bash_background` 立即返回 job id：长构建、测试套件、开发服务器不再卡住对话。输出流式落 `~/.pi/agent/pi-web/jobs/<id>.log`（8 MB 封顶），结束时只把尾部 4 KB 作为一条新消息带回。job 记录重启后仍在（被中断的会被结算，不会一直显示「还在跑」），停止会杀掉整个进程树，`bash_background` 与 `bash` 同样受命令审批管辖。
            - **常驻会话（pin）与分派者角色。** 被 pin 的会话不受十分钟闲置卸载影响，始终就绪；pin 为 `router` 的会话还会收到一段提示 —— 把活儿派给后台 Worker 并汇总回报，而不是自己动手。侧栏分区 + 设置 › 通用 › 常驻。
            - **模型 API 中断自愈。** 上游不可用几分钟到几小时时，会话挂起等待，恢复后自动接着干 —— 退避 30 秒 → 1 分 → 2 分 → 5 分 → 10 分 → 20 分 → 30 分并带抖动，双闸 40 次 / 6 小时（额度类 24 小时，从 5 分钟起探测）。设置 › 通用 › 中断自愈。
            - **长期记忆。** 偏好与事实跨会话保留在 `~/.pi/agent/pi-web/memory.json`（200 条、每条 4 KB），以最近 30 条注入提示词；`memory` 工具供模型写入，设置页可编辑。
            - **命令审批。** shell 命令执行前按危险命令规则匹配，可要求你确认（默认关闭；无人可确认时放行）。设置 › 通用 › 命令审批。
            - **「需要你」收件箱。** 停在提问或审批上的会话置顶在侧栏；手机端首页显示谁在等你、谁已完成。完成时还可推送通知，并提供停止推送。
            - **网页登录只要密码。** 用户名已移除（连同浏览器的 Basic 认证弹框），`/login` 在尚未设密码时兼作首次设置页。
            - **团队成员模型挂了会自动换。** 成员的上游开始失败（5xx、连接中断、额度耗尽）而团队里还有别的可用模型时，把成员切到另一个模型并让它接着干没干完的活。优先换**另一个 provider** —— 同一 provider 的故障通常连带其下所有模型；本次故障里已经试过又失败的模型不再重试；候选必须**模型存在且有凭据**；换满两次就改为提醒 team lead，不再硬换。代码错误、鉴权失败、模型不存在一律不触发切换。
            - **团队按钮左边的 `/goal` 按钮。** 点一下把 `/goal ` 插到光标处；写下目标，模型会跨轮次持续推进直到完成。
            - **目标模式升级为完整的 Alma 式面板。** 靶心按钮打开对话框，可填**可验证的完成条件**与重复计划（`5m` / `2h` / `1d` 带头；7 天封顶）。每一轮结束都由**另一个模型**拿条件核对对话，干活的那个模型不能再自己宣布完成；到了间隔就按定时器开下一轮，会话正忙时把这一格回滚而不是吞掉；7 天是硬上限。
            - **代理后面的 Cloudflare 隧道终于能用。** cloudflared 只会直连边缘节点、不认 `HTTPS_PROXY`，所以连接器现在通过本机回环桥把边缘连接与 Quick Tunnel 开通都走用户的 HTTP 代理；到站探针走同一条路，一条本来通的隧道不会再被误判成「网络故障」而拆掉。
            - **公网访问支持手机配对。** 电脑上出二维码，手机拿到一次性密钥（5 分钟有效）；批准后签发**按设备**的令牌，只存 SHA-256 哈希，装在 `__Host-` cookie 里，随时可撤销、30 天过期。web 密码照旧可用 —— 设备通道是给「不该一直手打密码的手机」用的。
            - **连接诊断。** 每次启动尝试都记录阶段 / 结果 / 耗时事件（隧道令牌与代理凭据已脱敏），收在可展开的面板里；「检查配置」按钮在本机跑 binary / proxy / token / DNS / 公网回环五项检查。

            ### 界面

            - **「引用」替代「关于这段内容」。** 选中文字后在光标处插入块引用，不再带脚手架文字。
            - **「另开新会话」** 把该消息的文字与图片带进新会话输入框。
            - **favicon 未读徽标**：等待输入为琥珀色，未读完成为蓝色，窗口隐藏期间累计计数。
            - **团队运行报告有了常驻入口。** 会话头部团队条仍会打开「当前会话所属的团队」；侧栏新增「智能体团队」一行，任何会话下都能打开报告（「智能体团队 · 共享任务列表」）。
            - **独立渲染组件**：SVG 围栏像 Mermaid 一样预览（只挂 img，源码不进 DOM）、音视频内联播放、公式一键复制 LaTeX、编辑落盘前的 diff 预览、结构化工具参数行（不再是一坨 JSON）、每轮耗时、CSV/TSV 虚拟化表格视图。

            ### 修复

            - **技能市场六项缺陷。** 已安装页签不再因元数据缺失崩溃；翻页途中改筛选不再永久卡死；429 不再记成健康；安装锁按 owner 区分，卸载取同一把锁；文件预览同时校验 `path` 形状与技能文件清单；compaction 模型候选只保留已存凭据的模型。
            - **团队停止要停全。** 停止 / 回收 / 结束判定 / 配额都补上计划独有成员；`plan.json` 损坏明确返回 400 而不是「尚无计划」；重发前校验 assignment 状态，不再重复投递；`team_create` 失败结果不再记到 lead 会话名下。
            - **MCP 登录适配 pi 1.5.2。** 转发 SDK store 的 refresh lock，项目信任语义与 pi 1.5 对齐。
            - **安装包不再携带本 checkout 的配置与凭据。** 追踪前先清空 payload，追踪出的 `.pi/` 目录被剪除，并有 fail-closed 扫描：发现任何 `.pi/` 路径、`Bearer ak_` 令牌、装甲私钥或构建残留即拒绝构建 —— 没有跳过开关。
            - **输入框重复提交。** 一次仍在解析 `#` 引用的提交不会再触发两次，慢响应也不会抹掉等待期间输入的文字。
            - **关闭的面板退出 Tab 焦点顺序**（`inert`）；粗指针设备得到 44 px 触控目标；中文会话时间不再压到标题上；「添加 provider」选择器留在对话框内；项目菜单改为滚动而不是长过视口；模型发现会翻页拉取目录（重复游标与翻页后失败返回 502，不再静默截断）。

            内置组件版本：pi 1.5.2、pi-web 0.10.0（fork 钉住的基线版本；本构建已携带上游 v0.10 → v0.17 的变更）。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out pi-agent-desktop
        uses: actions/checkout@v7

      - name: Upload component manifest to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./src-tauri/pi-agent-desktop-package.json').version")"
          gh release upload "v$version" src-tauri/resources/component-versions.json --clobber
          # A prerelease is never served by the updater. Say so explicitly
          # instead of relying on the value tauri-action used when it first
          # created the draft (v0.7.3 ended up marked prerelease).
          gh release edit "v$version" --draft=false --latest --prerelease=false

  # A partially failed matrix leaves the release a draft and skips `manifest`,
  # which is correct — but it was also completely silent. Four consecutive
  # v0.1.3 builds failed on Windows without anyone noticing, and the release was
  # published by hand with macOS artifacts only and no component manifest.
  notify:
    needs: [build, manifest]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # This repository currently has Issues disabled, so an issue-only alert
      # silently fails and reports nothing — which is how four consecutive
      # failed releases went unnoticed. The job summary always works; the issue
      # is attempted on top and starts working by itself if Issues are enabled.
      - name: Report the failed release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "## Signed release build failed"
            echo
            echo "[Run log]($RUN_URL)"
            echo
            echo "The release for this version stays a **draft** and has no"
            echo "\`component-versions.json\`: the manifest job only runs when every"
            echo "platform in the build matrix succeeds."
            echo
            echo "**Do not publish it by hand.** A release missing a platform's installer"
            echo "or its component manifest will not serve updates to that platform —"
            echo "that is exactly how v0.1.3 shipped macOS-only."
          } >> "$GITHUB_STEP_SUMMARY"

          issues_enabled="$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues 2>/dev/null || echo false)"
          if [ "$issues_enabled" != "true" ]; then
            echo "Issues are disabled for $GITHUB_REPOSITORY; reported in the job summary only."
            echo "Enable Issues to also get a persistent, notifying alert." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --state open --label release-failure --limit 1 --json number --jq '.[0].number // empty')"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Release build failed again: $RUN_URL"
          else
            gh label create release-failure --repo "$GITHUB_REPOSITORY" \
              --color B60205 --description "Signed desktop release build needs attention" 2>/dev/null || true
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Signed release build failed" \
              --label release-failure \
              --body "The signed desktop release build failed: $RUN_URL

          The release for this version stays a DRAFT and has no component-versions.json,
          because the manifest job only runs when every platform in the build matrix
          succeeds. Do not publish it by hand — a release missing a platform's installer
          or its component manifest will not serve updates to that platform.

          This issue is reused for subsequent failures; close it once a release is green."
          fi

  # Keeps Casks/pi-agent.rb (the Homebrew tap: `brew tap abcwyc/pi-agent-desktop
  # https://github.com/abcwyc/pi-agent-desktop`) on the release that was just
  # published. Runs only after `manifest` has published it, so a draft or partly
  # failed release never reaches Homebrew users. Placed after `notify` because
  # release-workflows.test.mjs slices the manifest job up to `notify:`.
  homebrew:
    needs: manifest
    # The cask lives in the upstream's own Homebrew tap: its url/homepage point at
    # abcwyc/pi-agent-desktop, so a fork running this job would rewrite
    # Casks/pi-agent.rb to a version the upstream has never released and then push
    # that broken cask to main.
    if: github.repository == 'abcwyc/pi-agent-desktop'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pi-agent-desktop
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Point the cask at the published DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./src-tauri/pi-agent-desktop-package.json').version")"
          digest="$(gh release view "v$version" --json assets \
            --jq '.assets[] | select(.name | endswith("_aarch64.dmg")) | .digest')"
          if [ -z "$digest" ]; then
            echo "No aarch64 DMG digest on release v$version" >&2
            exit 1
          fi
          node scripts/update-homebrew-cask.mjs "$version" "$digest"
          if git diff --quiet -- Casks; then
            echo "Cask already at $version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/pi-agent.rb
          git commit -m "chore(homebrew): update cask to $version"
          git push origin HEAD:main
