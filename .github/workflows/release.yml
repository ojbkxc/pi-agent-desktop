name: Publish signed desktop release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pi-agent-desktop-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          # macos-26 是硬要求（只有 SDK 26 才有新交通灯几何，见下面的 "Require the
          # macOS 26 SDK" 步骤）；macos-latest 只装 SDK 15。
          #
          # 2026-11-24 曾加过一条「重试时退回 macos-latest」的兜底，实测证明它没有意义：
          # macos-26 池子供给故障时 job 是 `runner_id=0`、steps 为空地被取消，重跑就该再
          # 要一次 macos-26；而落到 macos-latest 一定被 SDK 检查打红——那条兜底只会把
          # 「等池子恢复」变成「等 40 分钟然后确定失败」。已撤掉，改回固定 macos-26。
          - runner: macos-26
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            apple_signing_identity: "-"
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu --bundles deb
            apple_signing_identity: ""
          # Restored after the file-tracer fix in eacaca3/7f2a1c0: a literal
          # homedir() reaching an fs call made @vercel/nft glob the whole
          # Windows profile at build time, which failed on its junction loops.
          # Verified through desktop:prepare by windows-build-debug.yml before
          # re-enabling; Tauri bundling and signing are first exercised here.
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
            apple_signing_identity: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out pi-agent-desktop
        uses: actions/checkout@v7

      - name: Require updater signing secrets
        shell: bash
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          test -n "$UPDATER_PRIVATE_KEY"
          test -n "$UPDATER_PUBLIC_KEY"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Configure updater public key
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/configure-updater-public-key.mjs

      # The window controls are drawn by the AppKit the binary links, not the
      # one it runs on: an SDK 15 build shows the legacy traffic lights even on
      # macOS 26+, and with different button geometry (0.7.1 shipped from a
      # macOS 15 runner that way). Fail here instead of shipping that again.
      - name: Require the macOS 26 SDK
        if: runner.os == 'macOS'
        run: |
          sdk="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK $sdk"
          test "${sdk%%.*}" -ge 26

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Verify bundled component releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # 同号覆盖重发（本次口径）：跳过「必须比最新 Release 新」的闸门，
          # tauri-action 复用/移动已存在的 v0.8.7 tag。普通发版不要设它。
          PI_OVERWRITE_RELEASE: "1"
        run: |
          npm run release:manifest
          npm run release:verify

      - name: Prepare packaged Next.js server
        run: npm run desktop:prepare

      - name: Test desktop shell
        if: runner.os == 'Windows' || runner.os == 'Linux'
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --lib --target ${{ matrix.target }}

      # bundle_dmg.sh 在 GitHub 的 macOS runner 上偶发挂死（2026-11-23 第十一次重发
      # 实测：同一提交、同一 runner 镜像，上一轮成功、这一轮 32 秒无输出即退 1，
      # 与 hdiutil/AppleScript 接触 runner 残留挂载卷有关）。tauri-action 不是命令、
      # 没法套通用 retry 包装；记录在案，失败时重跑整个 build job——updater 的
      # .app.tar.gz 在 dmg 之前就已生成，重跑大概率直接全绿。
      - name: Build, sign, and upload updater artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PI_AGENT_DESKTOP_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
        with:
          tagName: v__VERSION__
          releaseName: pi-agent-desktop v__VERSION__
          releaseBody: |
            ## Pi Agent Desktop 0.8.7 (fork)

            **2026-11-24 · 覆盖式重发（第十八次）**

            > 版本号保持 0.8.7 不变，本次构建替换上一版的全部安装包。升级方式与普通更新相同，直接覆盖安装即可；配置、会话与任务记录都在 `~/.pi/agent/`，不受影响。

            本 fork 基于上游 pi-agent-desktop 0.8.2 / pi-web 0.10 构建，已并入上游 pi-web **v0.10 → v0.17** 的全部安全、稳定性与性能修复，并在此之上维护本 fork 的桌面功能线。

            本次是第十八次覆盖重发：**输出速度（TPS）真正与会话统计同口径**（那个数字此前是条死代码）、**扩展面板不再弹**、**停止按钮不再消失**、**计划弹框的按钮固定在底部**，外加 `deepseek-v4.1-flash` 的预设匹配修正。

            ### 本次重发新增 / Fixes in this re-release

            - **输出速度（TPS）与会话统计同口径 / output speed.** 与 DeepSeek Harness 的 `decodeTokens / (decodeMs/1000)` 逐行核对后修了三处：①**`finalRate` 原来是死代码**——`end` 动作不带消息，而 store 里的 `streamingMessage` 来自 `message_start` 快照，pi-ai 在那一刻把 `usage` 全填 0（响应头刚到、还没计费），于是 `usage.output` 恒为 0、那个「真实 token/s」分支永远不触发，屏幕上只有「字符 ÷ 4」估算。现在 `end` 携带 `message_end` 的完整消息。②**分母含 TTFT**——本仓起点是 `message_start`（一个 token 都没吐），dsh 只算「首 token → 消息组装完」的解码段；新增 `firstTokenAt` / `decodeMs`，在首个增量（text / thinking / toolCall，与 dsh 的 `isTokenDelta` 同范围）落点，分母优先用 `decodeMs`。③取整对齐（`≥10` 取整、`<10` 一位小数，`< 1` 仍显示 `< 1`）。文案也跟着改成「与会话统计同口径」。
            - **扩展面板真的不再弹 / extension dialogs.** 上一版只覆盖 `confirm` 与「选项里明确写着允许」的 `select`；`input` / `editor` 一律弹出（理由是「空串不是允许」）、`custom` 自绘面板也弹出（「没有可编程答案」）。现在 `input` / `editor` 自动答空串（空串是「没有额外信息」，不是取消），`select` 没有允许项就取第一项（选项集合就是扩展给的答案域），`custom` 在挂载后立刻收起；每次自动处理留一行审计日志。
            - **停止按钮不再消失 / stop affordance.** 旧口径 `showStop = isStreaming && !canQueueStreamingMessage`：只要输入框里有字（或挂了附件），主按钮就变成「排队发送」，**停止入口当场消失**——一边打字一边想停时看到的就是「点了没反应」。现在流式期间主按钮恒为 Stop；排队仍有 Enter（流式时本来就调 `sendQueued`）。
            - **计划弹框的底部按钮固定 / sticky footer.** 面板整体是 `overflow: auto`，底部那排「关闭 / 批准 / 停止」跟着内容一起滚，翻到任务列表中间就找不到批准按钮。现在面板是 flex 列 + `overflow: hidden`，中间内容单独滚动（`minHeight: 0`），footer `flexShrink: 0` 常驻底部；标题也在滚动区外。
            - **`deepseek-v4.1-flash` 的预设匹配 / preset match.** 归一化把版本分隔符吃掉了（`deepseek-v4.1-flash` → `deepseekv41flash` 与 `deepseek41` 互不包含），v4.1 的请求被目录序更靠前的泛化条目 `deepseek v4` 抢走；而那条「一行覆盖两个模型」的合并条目（版本序列 `["4","1","4","1","1017"]`）按长度永远最长，又会把 `deepseek-v4` 的请求抢走。现在版本序列从**原始串按分隔符**切，命中里先取「版本一致」那一组再比长度。实测：`deepseek-v4.1-flash` → v4.1 预设、`deepseek-v4` → v4 预设、`deepseek-chat` / `deepseek-reasoner` / `gpt-5` 等没有对应预设的仍然不借别的顶替。

            ### 第十七次重发内容 / Fixes in the previous re-release


            - **审批弹框的模型默认是主模型 / default model.** 计划里成员的 runtime 在真实机器上通常是 `unknown/unknown`（pi-team 读 `PI_PROVIDER_ID`/`PI_MODEL_ID`，本服务从不设置），归一后是空串，模型栏显示「未设置」——用户面对一个空下拉，只能从头挑。现在用当前会话主模型预填，**想改再改**；预填与改动判定同源（同一个 fallback 当基线），所以打开弹框不会显示「有未保存更改」，而真换了模型照样写进 PATCH。
            - **配额与 pi-team 同源 / quota parity.** 上游 `checkSpawnLimits` 现读 `PI_TEAM_MAX_GLOBAL_WORKERS`（缺省 32），桌面那套用设置项（默认 64/16，`0` = 不限）——两条闸各算各的，于是「面板说还有余量 → 点派发 → `LIMIT_EXCEEDED (32)`」。现在派发前把桌面配额写进 env；桌面 `0`（不限）会被换成一个大数，因为上游只接受正整数、`0` 会被它当成非法值回落到 32。
            - **删成员真的降配额 / removal.** 配额口径是 `config ∪ plan`，而删除只 splice 了 `config`：删了成员数字不动，对 launch 派发出来的成员更是直接「成员不在名册中」。现在同步摘 `plan.json` 的同名条目（同一把锁、同一原子写），**连 `approvedSnapshot.members` 一起摘**（漏了它，launch 会把已删成员又派出去）。
            - **未派发的计划不再占名额 / roster counting.** `readPlanRosterMembers` 不看 `plan.state`，`draft` / `review_pending` / `cancelled` 的成员照样被算成「活跃」，叠加「停掉的名册条目永久保留」，数字只涨不降。只排除明确列举的这三种，其余（含字段缺失、上游新增状态）照旧计入——少算一个真在跑的成员会让配额超卖。
            - **本队余量与全局余量同源 / workload parity.** `rosterWorkers` 只数 `config.members`，`globalWorkers` 数的是 `config ∪ plan`，同一面板两个数字基于不同名册。现在两边同源、都排 lead。
            - **成员模型为空时明确告警 / missing model.** 批准照常放行，而 launch 会拿 `unknown/unknown` 去 spawn，那个成员必然起不来，界面全程没一句话。现在编辑器顶部列出**哪些成员还没有模型**；只提示、不拦批准（真实机器上队长 runtime 恒为 unknown，硬拦会挡死最常见的流程）。
            - **连点「批准」不再静默 / approve guard.** 单飞守卫只返回一个没人看的 reason（调用方 `void` 掉返回值），用户连点第二下时既不报错也不动。现在守卫命中时同时把原因写到 `approveError` 上。
            - **成员行不再假装可点 / click affordance.** 整行挂着 `cursor: pointer`，但点击处理在内部按钮上，左右内边距是纯死区。指针语义收回到按钮。
            - **思考强度禁用时说原因 / disabled explanation.** 思考强度属于 runtime，没有模型就发不出去，禁用是对的；但界面只把下拉变灰。现在补 `title` + 一行可见提示。

            ### 第十六次重发内容 / Fixes in the previous re-release


            - **审批弹框「点几次才好」/ model catalog cache.** 打开「Review configuration」后立刻点成员的模型下拉——完全没反应，等一两秒再点才行，重开弹框又得重来。根因：下拉是 `disabled={!editable || catalog.loading}`，而 `useModelCatalog` 的 `loading` 初值恒为 `true`；`AppSelect` 把 `disabled` 传给原生 `<button disabled>`，浏览器**根本不派发 click**，第一下被整个吞掉。现在按 cwd 键控的模块级缓存（60 秒，`refresh()` 绕过）让**第二次及以后的挂载**直接以 `loading=false` 起渲染，且 effect 首轮在命中缓存时不再把 `loading` 拨回 true——两层缺一都不成。顺带把批量下拉的两个禁用原因（没勾成员 / 目录加载中）用 `title` 分清楚，不再长得一模一样。
            - **强杀 App 后残留的 server 孤儿 / orphaned sidecar.** 观测到 App 被强杀后留下一个旧 server，新实例又起一个，两个同时监听不同端口。看门狗本来就在（日志里有多次正常触发），漏的是判据：**Windows 上父进程死后 `process.ppid` 不会变成 1**，而 `kill(pid, 0)` 在 PID 被复用时会对无关进程返回成功——两条判据同时放行。补第三条 `process.ppid !== expectedParentPid`（父已换人），并排在 `kill()` 之前判。

            ### 第十五次重发内容 / Fixes in the previous re-release


            - **「所有错误——持续重试」真的持续 / unlimited retry.** 上一版给 24 小时 / 400 次上限：一个跨夜的模型故障会在恢复前一刻被判 `expired`，与「几天几夜还在请求」正好相反。现在 `deadlineAt: 0` 作「不限」哨兵（不能用 Infinity——落盘成 JSON 会变 null，重启读回来就成了立刻过期），`maxAttempts` 抬到 `MAX_SAFE_INTEGER`；`isOutageExpired` 与 `advanceOutageBudget` 都显式判 `> 0`，否则 0 会让 `now >= 0` 恒真。刹车仍由 Stop / 取消负责——那不是上限，是操作者的手。回归测试推进 20 万次仍然不过期，并保留「有限档仍然会过期」的对照。
            - **团队上限可以设成「不限」/ unlimited team quota.** 报错「活跃成员 34 已超过上限 32」的根子是**上限本身**：操作者要的是「我说派多少就派多少」，而配额把 0 当非法值回落默认，于是永远有一道关不掉的闸。现在 `0` 是合法的「不限」（设置项与 env 同义，负数也当不限），两处判据补 `limit > 0`（少了它 0 会让 `used + inflight >= 0` 恒真、把每一次派发都拒掉）。并发度刻意不跟随：0 个并发是静默死锁，仍回落默认 4。
            - **删成员真的降配额 / member removal.** 配额口径是 `config ∪ plan`，而删除只 splice 了 `config`：于是「删了成员数字不动」，对 launch 派发出来的成员更是直接 `成员不在团队名册中`。现在删除成功后同步摘 `plan.json` 的同名条目（同一把 `plan.json.lock` + 同一原子写），**连 `approvedSnapshot.members` 一起摘**（漏了它，launch 认领时会把已删成员又派出去）；摘不掉如实报「配额不会下降，请重试」。
            - **未派发的计划不再占名额 / roster counting.** `readPlanRosterMembers` 不看 `plan.state`，`draft` / `review_pending` / `cancelled` 的成员照样被算成「活跃」，再叠加「停掉的成员名册永久保留」，数字只涨不降。只排除**明确列举**的这三种：字段缺失、老格式、上游新增状态一律照旧计入——少算一个真在跑的成员会让配额超卖（这正是要防的），多算一个未派发的只是回到旧行为。`approvedSnapshot` 已落盘时即使 state 没流转也算。
            - **批准后弹框立刻收起 / approve feels instant.** 弹框唯一的自动关闭路径等的是 `plan` 从 `review_pending` 走到 `launching`，而这个状态只能由**被唤醒后的 lead** 调 `team_plan approve` 写入——中间隔着一整个模型回合，再等一拍 2 秒轮询。现在「投递成功」即置 `delivered` 信号，弹框立刻收起；真实流转仍由后台轮询确认，**失败可见性跟着搬到收缩态卡片**（弹框关了也不会让「批准失败」消失），批准响应还带上投递后读到的计划快照，省掉等轮询那一拍。
            - **重命名预填原名 / rename seeding.** 两处入口都用 `session.name` 预填，而从未重命名过的会话 `name` 就是空串——输入框开出来空白，想改名得从零敲。现在预填**显示值**（name → 首条消息 → id 前缀），并保证「没改名就提交」不写盘（不让一次误点把 fallback 固化成正式名）。
            - **右键菜单在浏览器里也能用 / row context menu.** 原来只有桌面壳弹原生菜单，浏览器里右键冒出的是 webview 自己的 Reload / Inspect。现在右键先试原生菜单，不可用就落在光标处的同一份行操作菜单（重命名 / 置顶 / 继续到项目 / 归档 / 删除 + 元信息）。
            - **会话不再展开子项 / no child rows.** 按操作者要求去掉子会话渲染，顺手删掉那个「点了没反应」的折叠箭头。
            - **TPS 用真实 usage 对齐 / output tokens per second.** 流式中只能估算（字符 ÷ 4 ÷ 秒）；一轮结束时 provider 的真实 `usage.output` 到手，就用 `output / 流式秒数` 换成真值并保留 8 秒——那才是「{tps} tok/s」该显示的数字。位置也挪到输入框底栏、「自动压缩」旁边，不再单独占一行。
            - **目标能暂停/恢复 / goal pause-resume.** 之前只有扩展内部能写 `paused`（聊天框里敲 `/goal pause`，或撞了双闸），界面上只有一个只读进度条。现在目标条上有暂停/恢复按钮：`PATCH /api/goals/[session]` 只允许 `active ↔ paused`（终态一律 409，误点一下不能让已完成的目标重新烧钱），切态**不重置**轮数与计时——暂停不能变成免费重置预算。
            - **本地模型服务不再被「私网地址」拦死 / local model servers.** 填 `http://127.0.0.1:8787/v1` 导入模型时报「Base URL cannot point at a local or private network address」：那条拒绝的判据是「等于已存端点」，而首次添加本地 provider 根本没有已存端点，必然被拒。现在按「谁在问」分：本机发起的请求可以指向本机/私网，中继 / Tailscale funnel / 已允许登录的远端仍然拒；「不借已存凭据去新地址」那条防线原样保留。
            - **破甲「开着但什么都没做」/ purge passthrough hint.** 出厂默认是「总开关开、系统提示归一化 / 死区改写 / 同义词替换三个都关」，**这就是纯转发**——而界面上只写「已启用」，操作者看不到任何改写，只会以为功能坏了。现在这种状态下会明确说明「请求仍然原样发送」，并点名哪三个开关能让它真正生效（默认值**不变**：默认关是刻意的安全选择）。实测佐证：默认档对样例文本一个字都不改；打开死区改写后 `渗透测试 → 授权的安全评估测试`、`漏洞利用 → 漏洞验证（授权环境）`、`抓包 → 流量分析` 各命中一处，且重复改写幂等（工具循环重发同一条消息不会叠加）。
            - **扩展面板默认永久允许 / extension dialogs.** `confirm` 直接答允许、`select` 只在选项明确是「允许」时才自动选（措辞里没有允许语义的仍然弹出——替用户在业务选项里挑一个不是「允许」，那是猜）；`input` / `editor` / 自绘面板一律不代答。自动作答不 emit 前端请求，所以不占「有对话框在等人」的判据；默认开着但可在设置里关，且每次自动作答留一行审计日志。
            - **未知思考档位被报成「关闭」/ thinking level (P3).** 会话首次运行前 SDK 还没报思考档位时，`get_state` 把它兜成 `"off"`——那是**语义值**「关闭思考」而不是「未知」，用户一点就把会话文件还原的档位覆盖掉了。现在报 `null`（与相邻的上下文用量同口径：拿不到就说拿不到）。
            - **空闲定时器与容量上限对「在用」的判据不一致 / idle timer (P3).** 10 分钟空闲定时器只看「有没有在跑」，而容量回收还排除「有 SSE 订阅者 / 有扩展对话框在等人 / 输入框有排队消息」。后果：有流在拉、或对话框正等人回答的会话，静默 10 分钟后被连人带流拆掉（`session_shutdown` → 前端重连冷启动重读会话文件，扩展内存状态与在途 UI 全部重来）。选中会话侥幸没事只因为浏览器每 30 秒续租；后台标签页、手机挂起、只订阅事件的消费者没有那个租约。现在两条路径共用同一份判据。

            ### 第十四次重发内容 / Fixes in the previous re-release

            - **按 provider 的重试策略 / per-provider retry policy（新功能）.** 添加模型 API 时在 provider 编辑区的 API 字段之后可选三档：**默认**（与上游行为逐字节一致，仅临时错误交给 SDK 既有重试）、**仅临时错误**、**所有错误——持续重试**。实现不是另写一套重试循环（那会与既有的挂起 + 退避 + 落盘 + 调度恢复重复驱动同一轮），而是换分类口径：`all` 档把 401/403、模型不存在这类 **terminal** 错误与 **transient** 一并升级成可挂起的 outage，由既有恢复链路接管。**Stop 语义不变**——本轮被停止时一律不挂起、不续跑，这正是「直到本轮被停止」的边界；同时 `all` 档给更宽的等待（24h）与尝试上限（400 次），「持续重试」不等于「永不放弃」。策略存 pi-web 自己的 settings.json，**不写 models.json**（那是 pi 的配置格式，多塞字段会被它当成非法 provider 键）。界面上读失败按默认渲染、不阻塞面板；保存失败回退旧值并提示，绝不显示一个没落盘的策略。
            - **并发启动同一会话会造出两个实例 / duplicate wrapper (P2).** 启动互斥原本在第一个 await 之后才落锁，两条 chat 路径在那之间会挂起——两个并发请求各建一个 wrapper，前者被覆盖后**不可达**、还要占着同一个会话文件的写者位。现在进入即占位，释放带归属校验。
            - **已删除的会话仍返回 200 / ghost session (P1).** 会话文件被外部删除后路径缓存不过期，打开时 SDK 会凭空造一个空会话并返回 200。现在读路径校验文件，删除即 404。
            - **后台任务测试挂死 31 分钟 / test hang.** 这些用例起真实 shell，`node --test` 没有默认超时，一个不报退出的 shell 就把整轮拖住（实测 1877 秒）。现在每个用例 90 秒硬上限，卡住变成一条带名字的失败。

            ### 第十三次重发内容 / Fixes two re-releases ago

            - **只读 GET 会重写会话文件 / read-path rewrite (P0, 数据丢失).** 打开一个旧版（v<3）会话时，SDK 的 `open()` 会**截断重写**整个文件，并且只写回它能解析的行——而驱动它的只是一个普通的会话打开请求。实测一条 GET 让文件从 387 字节变 289、头部被就地升级、坏行永久消失；重写还先归零再写，窗口内 pi 的追加一并蒸发。现在读路径一律不落盘，旧版文件的迁移在内存里完成（渲染结果不变），落盘只发生在明确要改文件的写路径。
            - **一次终端回收失败会带走整个服务 / teardown crash (P1).** 会话销毁时 `dispose()` 抛错会变成**未处理的 Promise 拒绝**，而 Node ≥15 默认把它当致命错误——一次 PTY 回收失败就让桌面服务退出、**所有会话一起死**。现在销毁流程任何一步失败只记日志并继续。
            - **已删除的会话仍能打开 / ghost session (P1).** 会话文件被外部删除（终端、另一个窗口、清理脚本）后，路径缓存不过期，打开时 SDK 会**凭空造一个空会话**并返回 200——客户端把已删除会话当空会话渲染，id 还对不上。现在读路径校验文件，删除即 404。
            - **「停止」可能静默失效 / Stop (P2).** 停止时清理队列的调用写在保护块之外，它一抛错，真正的 abort 就不执行——按钮看着按了、运行照跑，而且十分钟后那次强制清理会把**仍在运行**的会话拆掉、当前轮输出全丢。
            - **`/命令` 被记成「跑完了一轮」 / command completion (P2).** 扩展命令是就地处理、并不启动 run，却被当成一轮完成：发一条假的完成推送、用命令文本生成会话标题，最要紧的是**可能自动批准团队计划**。现在只有真的跑过一轮才算完成。
            - **并发打开同一会话会造出两个实例 / duplicate wrapper (P2).** 启动互斥在第一个 await 之后才落锁，两条 chat 路径在那之间会挂起——两个并发请求各建一个实例，前者被覆盖后**不可达**、还要占着同一个会话文件的写者位。现在进入即占位，释放带归属校验。
            - **带 BOM 的会话整个消失 / BOM (P2).** 用 PowerShell 或记事本保存过的会话文件（头部带 UTF-8 BOM）解析失败，于是从列表里消失、打开报 404。仓库里其它 JSON 读取早就容忍 BOM，只有会话读取没有。
            - **一条坏条目让整场会话打不开 / malformed entry (P3).** 缺字段的消息条目让统计抛错，详情请求 500——会话在列表里看得见、点开就白屏。现在跳过畸形条目，可读内容照常显示。
            - **模型目录刷新的畸形 JSON / refresh (P3).** 一个打错的 `{` 会被当成「刷新全部」，一次拼写错误变成一次全量目录请求；现在区分「空 body（=全部）」与「解析失败（=400）」。
            - **预览的 CSP 第二层 / preview CSP (P3).** HTML/SVG/React 预览此前只靠沙箱属性一层（当前不可利用，但那是回归面）；现在文档内再加一层策略，禁子框架、插件、`<base>` 重定向与 `javascript:` 表单目标。
            - **测试基建 / test infrastructure.** 后台任务测试在并发全量里曾挂死 **31 分钟**（`node --test` 无默认超时，一个不报退出的 shell 就能拖住整轮）；现在 90 秒硬上限，卡住会变成一条带名字的失败。

            ### 第十二次重发内容 / Fixes in the previous re-release

            - **API 闸门全量 / API gates (P1×29 + P2×21 + P3×4).** 129 个写处理器此前分三类不达标：畸形 JSON 被报成 500 并回显解析器原文（29 条）；读 body 却缺来源守卫/Content-Type 闸门（21 条）；无 body 路由无来源守卫（4 条）。现统一为 来源守卫 403 → 415 → 400(JSON) → 400(字段) → 500，新增 96 条回归探针。
            - **安全 P1×2 / security.** ① 密码节流分桶：此前隧道访客每分钟一个错误 Basic 头就能把操作员永久锁死在本机登录之外，现本机与远端分账互不拖累；② `/api/files` 的会话引用旁路：repo 内指向 roots 外的符号链接，agent 触碰过一次即可被浏览器借 sessionId 读穿，现 realpath 后比对黑名单。
            - **环境变量泄漏链 / env leak chain (P0).** 终端、后台任务、git 三条子进程路径各自手搓 env 剥离，只有一份是完整的——而漏掉的 `PI_DESKTOP_API_TOKEN` 正是「任意路径写文件」端点的唯一凭据。现统一走共享剥离清单。
            - **实时 tok/s / live tok/s.** 输入框下方新增速度条（流式字符 ÷4 ÷ 秒数的量级估算）；首版两处口径缺陷当场修掉：分母冻结导致速率虚高 60 倍、重连首采样直冲 2000 tok/s。
            - **破甲试跑 / purge preview.** 控制台新增「试跑」面板：粘一段样例文本按**草稿**设置跑，左右对照改写前后与命中计数——不必先保存（保存是全局生效的）。服务端与数据面共用同一批纯函数，预览即实际。
            - **聊天界面 / chat (P2/P3×3).** 内置命令 15s 超时不再留孤儿计时器；`@` 文件索引跨目录切换不再错乱；流式 selector 提升为模块级（消除每次渲染的重订阅）。
            - **README 与 i18n.** 双语 README 的更新检查口径对齐实际行为（只查 pi-agent-desktop 本身）、中文版补齐 Linux 全部缺项、功能清单增补后台命令/团队/破甲控制台；zh-TW 漏键补齐。

            ### 第十一次重发内容 / Fixes in the previous re-release

            - **后台命令 / background-jobs (P1).** Windows 上没有 Git Bash 的机器（Git 装在 D 盘、只装了 MSYS2、干净装机）此前**每一条后台任务都直接失败**（`No bash shell found`）；现在三级兜底（SDK 探测 → 仓库终端探测 → PowerShell），降级只提示一次不静默，旧版 WSL bash 的 stdin 传输路径一并补上。
            - **破甲 / purge (P2).** 「降低思考档位」此前只压不还，一轮跑完会话被永久留在低档位、关掉开关也不回升（「关闭=纯转发」失效）；现改为运行结束自动还原，操作者中途手动改过档位则尊重手动选择。「写入技能文件」此前把预设标题写进 frontmatter `name`，而 53 条预设里 33 条标题不是合法技能名；现改为写规范 id（标题保留在 description），落盘改原子写。
            - **API 健壮性 / API hardening (P2).** autopilot、lean-mode、network-proxy、pinned-sessions、relay、terminal、skills、open-in-explorer 八条写路由此前把非法 JSON 报成 500 并回显解析器原文；现在统一返回 400 与通用文案，open-in-explorer 顺带补上缺失的 Content-Type 闸门。
            - **已知未修 / known gaps.** dsh-purge 适配缺口四项（boost 强化段、refusal-retry、技能归档导入、上游 agent 预设正文提炼）维持现状，判定与证据见 `docs/agents/purge-adaptation-audit.md`。

            ### 第十次重发内容 / Fixes two re-releases ago

            - **安全 / security.** models-config 的模型发现与测试不再把本机存储的 API 凭据发往请求指定的新 Base URL；未保存的私网/环回目标（含 IPv4 与 IPv6-mapped）一律拒绝，已保存的本地 provider（Ollama 等）仍然放行。远端读取网络代理配置时遮蔽 `user:pass@`。
            - **团队 / teams.** 「暂停」按钮现在真正调用服务端 pause（此前只 abort lead）；lifecycle 请求加 15s 超时，挂起后按钮不再永久禁用。
            - **无人值守 / unattended.** campaign 会话的阻塞对话框纳入 120s 安全默认（不扩大团队计划自动批准的范围）。
            - **对话 / chat.** `/name` 后正确提升新建会话（草稿 rekey 与 AppShell 通知恢复）。
            - **API 健壮性 / API hardening.** scheduled-tasks、memory、autofix 的非法 JSON 返回 400 而非 500；pinned-sessions 与 background-jobs 写路由补来源校验。
            - **界面 / UI.** Autofix/Campaign 的工作目录清空后不再被默认值回填；cron 预览失败显示错误并可重试（保存仍要求校验通过）。
            - **已知未修 / known gaps.** chatWorkspace 并发启动的双 wrapper 竞态（需并行请求才可达）；campaign 运行中成本累计与跨天间隔（P2/P3 设计占位）。

            ### 一、本次新增 / What's new

            #### 1. 长时自主「项目战役」P1 / Project campaigns (P1)

            告诉它一个 git 仓库和一组待办项，它自己排队做完；每一项都必须通过你配置的验证命令。

            - **逐项推进，判据在引擎侧。** 每个待办项包含指令与验收条件；agent 在独立会话中执行，每轮结束后由引擎运行 `verifyCommand`，**退出码 0 才算完成**，否则把失败输出回喂到下一轮继续修。
            - **有界执行。** 单项轮数、战役总轮数、总成本都有上限，触顶即停，不会无限烧钱。
            - **创建即硬闸。** 必须提供 git 工作目录、正数的 `maxTotalCostUsd`、以及非 `off` 的命令审批档；不满足直接返回 400，不落盘。
            - **可恢复。** 进度原子写入 `<agent dir>/campaigns/<uuid>.json`；进程重启后从第 K 项续跑，而不是从头再来。
            - **Provider 中断不计轮次。** 与自动修 Bug 共用中断账本，新增 `campaign` 作用域，由战役自己的 sweep 续跑；通用中断调度器只读不抢，避免双驱动。
            - **可控。** 页面提供 stop / pause / resume / delete，逐项状态、日志与成本可见。

            > **P1 边界（重要）**：这是 MVP。跨天间隔（`intervalMs` 已进数据模型与校验，UI 暂不暴露）、git checkpoint、运行中成本闸、多 worker 均尚未实现；P1 默认背靠背连续执行。

            #### 2. 命令审批档位切换 / Command-approval switch

            聊天输入框底栏、模型选择器右侧新增紧凑指示器，点击循环切换：

            `全权限（off，默认）→ 仅危险命令 → 全部命令 → 全权限`

            - **全权限**：不拦截任何 shell 命令、零提示；切到这一档静默直接保存（等价 cc-haha 的 bypassPermissions）。
            - **仅危险命令**：只对命中危险规则（`rm -rf`、强制推送、`DROP TABLE` 等）的命令要求确认。
            - **全部命令**：每条 shell 命令都先确认；进入这一档前弹一次确认，取消不改档位。
            - 读取与保存只走既有 `GET/PUT /api/tool-approval`，判定始终在服务端；保存失败保持原档位并提示；非本机（隧道/远端）置灰只读，不发写请求。
            - 按钮带 `aria-label`，档位变化用 `aria-live` 播报；三语文案统一。

            #### 3. 破甲控制台 / Purge console

            - **默认开启。** 总闸 `enabled` 与「按模型自动套用」都默认打开，新装即按当前会话模型套用对应预设；关掉总闸仍是逐字节纯转发（不判定、不重写、不改一个字）。
            - **按模型自动套用。** 请求发出前按会话模型在 53 条内置预设里查一次，命中就把预设正文原样拼在系统提示词之前或之后。`exact` 只认同名模型，`vendor` 才退到同厂商；也可以固定某条预设 id。拿不到模型或未命中就什么都不套。
            - **设置面板。** 新增「按模型自动套用」一节：开关、前后位置、匹配强度、固定 id，以及「默认模型 X → 将套用 Y」的实时预览；命中次数进入只读统计。
            - **性能。** 设置读取改为 mtime+size 缓存（工具循环每轮不再全量读盘+解析）；治理改写单次扫描并按规则缓存正则，输出逐字节等价；模型只归一化一次，53 条预设的归一化结果按行缓存；`GET /api/purge` 补上与其余读接口一致的 Host/Origin 门。
            - **闸门归属。** 新增只读面板，展示各闸门 allowed/denied 计数与最近事件，补齐 `/api/purge/gate-log` 的前端消费；移除冗余的 `/api/purge/active-model` 路由。

            #### 4. 后台命令可见可停 / Background commands

            - Tasks 页新增后台命令列表（运行中 / 近期）与停止按钮，补上 `GET /api/background-jobs` 此前没有前端消费的缺口。
            - 底层能力回顾：`bash_background` 立即返回 job id，长构建、测试套件、dev server 不再阻塞对话；输出落盘 8 MB 封顶，完成时只把尾部 4 KB 作为新消息注入；重启后按记录结算，不会停留在「仍在运行」；停止会杀整个进程树；与 `bash` 受同一套命令审批约束。

            ### 二、本版同时包含的能力 / Also in this build

            #### 安全（上游 v0.10 → v0.17 移植）

            - **preview 模式绕过已封堵。** 每个发行版都带同一个 `previewModeId`，请求头 `x-prerender-revalidate` 与之相等时 Next 会跳过 `proxy.ts`，即绕过 Web 密码门与 Host/Origin 校验（腾讯玄武实验室报告）。npm CLI 启动时轮换三个 preview 密钥；桌面启动器在 Next 之前剥掉两个 revalidate 请求头，并在每次启动时把密钥重写为新的随机值。
            - **PowerShell 与 bash 同口径消毒。** PowerShell stand-in 剥离 `PORT`、`NODE_ENV`、`NEXT_*`、`PI_WEB_PASSWORD`、`PI_DESKTOP_API_TOKEN`，只在被点名时激活；bash stand-in 同样改为显式激活。
            - **npx 不再继承主机密钥。** 技能安装、搜索、更新在运行第三方 npm 代码前剥离主机环境变量。
            - **信任链归于正确的会话。** 子代理会话按父会话决定项目信任（只读一次，不写 `trust.json`）；恢复的会话按自身目录决定；未信任目录里的子代理 profile 不出现；未信任仓库的 `enabledModels` 不再遮蔽全局列表。
            - **文件边界更紧。** git/diff 端点逐级 `lstat`（防 junction 逃逸）；上传走同盘暂存、两次拒符号链接、原子替换；无界后缀 Range 返回 416；MIME 查表只认自有属性；桌面 popup 按 nonce 清理；代理凭据不随环境变量泄漏；技能市场外链只渲染 `http(s)`。

            #### 稳定性

            - `session_start` 弹对话框的会话现在能正常启动，不再在首轮之前死锁。
            - 登录流断线不崩；设备码 SSE 流对已关闭的 controller 加了守卫；pi SDK 在启动时预导入；ChatGPT OAuth 的 device id 修正。
            - Code mode 不因一次启动卡顿被整个进程关掉。
            - 补齐剩余的在途回合失效路径守卫，快速切换会话不会把旧回复写进新对话。
            - 隧道探针固定直连，与 `cloudflared` 自身的出网路径一致 —— 手动代理坏掉时不会再被误判成「隧道坏了」。

            #### 性能

            - **流式只重渲染回复本身。** 流式状态移出 React：每个 chunk 只重渲染 `StreamingReply`；整段流就是一个代码围栏时完全跳过 markdown 解析器。
            - **会话列表只重扫文件尾部**，不再从文件头读起。
            - **provider 签名不再下发浏览器**，长会话载荷更小。
            - **共享 model runtime。** provider 与扩展目录只加载一次（带 TTL），不再按请求重建。

            #### 桌面与团队

            - **自动修 Bug。** 给一句话，专用会话改代码；每轮结束后由引擎跑项目验证命令（test → typecheck → check → lint，无可探测判据的任务直接拒绝）。退出码 0 是唯一成功；失败输出回喂下一轮；轮数上限默认 20；进度原子落盘，重启可续。
            - **常驻会话与 router 角色。** 常驻（pin）会话豁免 10 分钟空闲卸载；标记为 `router` 的会话会收到「把工作派给后台 worker、汇总回执而不是自己动手」的分派提示。侧栏分区 + 设置 › 通用 › 常驻。
            - **Provider 中断自愈。** 模型 API 数分钟到数小时不可达时，会话挂起等待，恢复后自动续跑；退避 30s → 1m → 2m → 5m → 10m → 20m → 30m（带抖动），双闸 40 次 / 6 小时（配额错误 24 小时），配额错误从 5 分钟起试。
            - **长期记忆。** 偏好与事实存于 `~/.pi/agent/pi-web/memory.json`（200 条、每条 4 KB），注入最近 30 条；模型可经 `memory` 工具写入，设置页可编辑。
            - **「Needs you」收件箱。** 停在提问或审批上的会话置顶显示，手机首页也能看到谁在等你、谁已完成；完成的运行可推送通知，并可关闭推送。
            - **纯密码登录。** 去掉用户名（包括浏览器 Basic-auth 弹窗）；未设置密码时 `/login` 兼作首次设置页。
            - **团队模型自动切换。** 成员所用 provider 开始失败（上游 5xx、连接中断、配额耗尽）且团队还有可用模型时，自动换到另一个模型继续；优先跨 provider，已试过的模型不重试；切换两次后通知 lead。代码错误、鉴权失败、模型不存在不触发切换。
            - **`/goal` 与目标面板。** 团队按钮旁一键插入 `/goal `；目标按钮打开 Alma 式面板：可验证的完成条件、重复计划（5m / 2h / 1d，7 天封顶），每轮结束由一个**独立模型**核对条件，工作模型不能自判完成。
            - **Cloudflare 隧道。** 命名隧道在登记后自动绑定固定域名，无需重启；cloudflared 忽略 `HTTPS_PROXY`，因此经回环代理桥接出网，验证探针走同一条路径；连接诊断记录每次启动的阶段/结果/耗时，并对隧道 token 与代理凭据脱敏。
            - **手机配对。** 电脑上的二维码把一次性密钥（5 分钟）交给手机；批准后签发按设备区分的 token（仅存 SHA-256、`__Host-` cookie、30 天有效、可随时撤销）。Web 密码仍然可用。
            - **计划弹框与计划控制。** 「查看配置」弹框与聊天输入框等宽（容器查询断点，窄窗不再横跨屏幕）；有父计划的计划卡新增 Stop，RuntimeControls 支持 pause / resume 与逐成员模型 / 思考档位编辑（运行中的成员拒绝编辑，返回 409）。
            - **界面细节。** cc-haha 风格的工具调用聚合行（默认收起、回合尾动词摘要）、团队状态条移至消息列上方整宽横幅、上下文环方形用量面板（含真实压缩触发点与立即压缩）、压缩阈值回归档位占比（均衡 50% / 长上下文 80%）、团队会话标题剥离 `<agent-team-request>`、团队模型下拉修复、配置横条单行短版、泳道连线终点锚定收件方。
            - **独立渲染器。** SVG 围栏像 Mermaid 一样预览（仅 `<img>`，源码不进 DOM）、内联音视频播放、显示公式复制 LaTeX、编辑前 diff 预览、结构化工具参数行、每轮耗时、CSV/TSV 虚拟化表格。

            #### 修复与无障碍

            - **技能市场六项。** 已安装页不再因最小元数据崩溃；筛选切换后无限滚动不再卡住；429 不再被记为健康；安装与卸载共用 owner 锁；文件预览同时校验 `path` 形状与技能文件清单；压缩模型选项只列已存凭据。
            - **团队。** Stop / reclaim / ended / quota 覆盖仅存于计划的成员；坏 `plan.json` 返回 400 并说明原因，而不是「还没有计划」；重发会校验任务状态，不再重复投递；失败的 `team_create` 不再记到 lead 会话头上。
            - **MCP 登录适配 pi 1.5.2**，项目信任跟随 pi 1.5 语义。
            - **安装包不再携带本机配置或凭据。** 打包前清空载荷、裁剪 `.pi/`，并对任何 `.pi/` 路径、`Bearer ak_` token、PGP armored 私钥或构建残留做 fail-closed 扫描，没有跳过开关。
            - **输入框双提交。** 仍在解析 `#` 引用的提交不会触发第二次；慢响应不会清掉等待期间输入的文本。
            - **无障碍与布局。** 关闭的面板退出 Tab 序（`inert`）；粗指针设备 44 px 点击区；CJK 会话时间不再压住标题；添加提供商选择器留在对话框内；项目菜单改为滚动；模型发现按目录分页（重复游标与分页后失败返回 502）。
            - **计时器与竞态。** 团队轮询判死定时器、通知 store 单句柄覆盖、9 处复制提示计时器互踩；`/goal` 与团队条不再每条消息闪空；文件查看器增量失败保留已加载内容。
            - **测试。** 恒真断言改为跨行 `assert.match`，并做真·反向复现（删源码行才红）。

            ### 三、组件与升级 / Components and upgrade

            - **组件**：pi 1.5.2、pi-web 0.10.0（本 fork 固定底座，上游 v0.10 → v0.17 的改动已移植）、Next.js 16.4.4、undici 8.12.3。
            - **依赖**：8 个 `@earendil-works/*` 包精确锁定；`npm audit --omit=dev` 零漏洞。
            - **升级**：安装本次构建覆盖旧版即可；配置、会话、任务与记忆均保存在 `~/.pi/agent/`，升级不丢。

