name: Publish signed desktop release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pi-agent-desktop-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            apple_signing_identity: "-"
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu --bundles deb
            apple_signing_identity: ""
          # Restored after the file-tracer fix in eacaca3/7f2a1c0: a literal
          # homedir() reaching an fs call made @vercel/nft glob the whole
          # Windows profile at build time, which failed on its junction loops.
          # Verified through desktop:prepare by windows-build-debug.yml before
          # re-enabling; Tauri bundling and signing are first exercised here.
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
            apple_signing_identity: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out pi-agent-desktop
        uses: actions/checkout@v7

      - name: Require updater signing secrets
        shell: bash
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          test -n "$UPDATER_PRIVATE_KEY"
          test -n "$UPDATER_PUBLIC_KEY"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Configure updater public key
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/configure-updater-public-key.mjs

      # The window controls are drawn by the AppKit the binary links, not the
      # one it runs on: an SDK 15 build shows the legacy traffic lights even on
      # macOS 26+, and with different button geometry (0.7.1 shipped from a
      # macOS 15 runner that way). Fail here instead of shipping that again.
      - name: Require the macOS 26 SDK
        if: runner.os == 'macOS'
        run: |
          sdk="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK $sdk"
          test "${sdk%%.*}" -ge 26

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Verify bundled component releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run release:manifest
          npm run release:verify

      - name: Prepare packaged Next.js server
        run: npm run desktop:prepare

      - name: Test desktop shell
        if: runner.os == 'Windows' || runner.os == 'Linux'
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --lib --target ${{ matrix.target }}

      - name: Build, sign, and upload updater artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PI_AGENT_DESKTOP_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
        with:
          tagName: v__VERSION__
          releaseName: pi-agent-desktop v__VERSION__
          releaseBody: |
            ## Pi Agent Desktop 0.8.3 (fork)

            The **ojbkxc fork** of pi-agent-desktop, built on upstream 0.8.2. This release carries the security, stability and performance work from upstream pi-web v0.10 through v0.17, a pi SDK 1.5.2 / Next.js 16.4.4 / undici 8.12.3 upgrade, and the fork's own additions.

            ### Security (upstream v0.10 → v0.17, ported)

            - **The preview-mode bypass is closed.** Every build shipped the same `previewModeId`, and a request carrying the matching `x-prerender-revalidate` header made Next skip `proxy.ts` — the web-password gate and the Host/Origin checks (reported by Tencent Xuanwu Lab). The npm CLI now rotates the three preview secrets at startup; the desktop launcher strips both revalidate headers from every request before Next sees it and rewrites the secrets to fresh random values on each start, so the shipped ones are worthless even if the strip is ever bypassed.
            - **PowerShell is sanitized like bash.** The PowerShell stand-in strips `PORT`, `NODE_ENV`, `NEXT_*`, `PI_WEB_PASSWORD` and `PI_DESKTOP_API_TOKEN` from the environment, activates only when named, and no longer hides user extensions. The bash stand-in is opt-in for the same reason.
            - **npx no longer inherits the host's secrets.** Skill install, search and update strip host environment variables before third-party npm code runs.
            - **The trust chain follows the right session.** Subagent sessions decide project trust from the parent session (read once, never written); restored sessions decide from their own directory; subagent profiles in an untrusted folder stay hidden; an untrusted repository's `enabledModels` can no longer shadow the global list.
            - **File boundaries are tighter.** git/diff endpoints `lstat` every path level (no junction escape); uploads stage on the same disk, reject symlinks twice and replace atomically; an unbounded suffix range answers 416; MIME lookup only matches own properties. Desktop popups clean up by nonce, proxy credentials are stripped from inherited environment variables, and skill-market links render only `http(s)` URLs.

            ### Stability

            - **A session whose `session_start` asks a dialog now starts** instead of deadlocking before its first turn.
            - **Login survives a disconnect.** The device-code SSE stream guards its closed controller, the pi SDK is preloaded at startup, and the ChatGPT OAuth device id is set correctly.
            - **Code mode stays on.** A startup stall no longer switches Code mode off for the whole process.
            - **The last in-flight-turn invalidation paths are guarded**, so a fast switch cannot apply a stale reply to a new transcript.
            - **The tunnel probe goes direct**, bypassing the session proxy exactly like `cloudflared` itself — a bad manual proxy no longer reads as "tunnel broken" and tears down a working tunnel.

            ### Performance

            - **Streaming re-renders only the reply.** Streaming state moved out of React: a chunk re-renders `StreamingReply` alone instead of the whole window, and a stream that is one code fence skips the markdown parser entirely.
            - **Session lists rescan only the tail** of a growing session file instead of reading it from the top.
            - **Provider signatures never reach the browser**, shrinking the payload of long sessions.
            - **One shared model runtime.** Provider and extension catalogs load once (with a TTL) instead of being rebuilt for every provider or skills request.

            ### Dependencies

            - pi SDK **1.5.2** (eight `@earendil-works/*` packages pinned), Next.js **16.4.4**, undici **8.12.3** (nine security advisories). `npm audit --omit=dev` reports zero vulnerabilities.

            ### New

            - **Autofix.** Give it one sentence; a dedicated session edits the code, and after every round the engine itself runs the project's verify command (test → typecheck → check → lint, with tasks that have no criterion refused). Exit 0 is the only success. Failure output feeds the next round, the round cap defaults to 20, and progress is written atomically so a restart resumes the task.
            - **Keep-alive.** A 15-second heartbeat, recovery of interrupted sessions driven by pid liveness (a live pid is never treated as an orphan), and a cross-platform supervisor (`scripts/pi-supervisor.mjs`: Windows scheduled task, launchd, systemd user timer) with a 5-per-hour restart budget and a network probe that waits instead of restarting. Settings › General › Keep-alive.
            - **Cloudflare named tunnels bind a fixed domain.** After registration the app polls the ingress rules cloudflared publishes; when your custom hostname points at the local gateway it binds itself, with no restart, and the fixed public URL is shown with copy/open. Public verification retries on a 0/2/4/8/15-second schedule within a 45-second budget.
            - **A web password can live in settings.** Besides `PI_WEB_PASSWORD` (which still wins), the password can be stored as a scrypt hash in a 0600 file — never plaintext. Changing it rotates the session token, so old sessions stop working. Settings › General › Server.
            - **cc-haha plan controls.** A plan card with a parent plan gets a Stop button, and RuntimeControls adds pause / resume plus per-member model and reasoning-level edits (a running member refuses edits with 409).

            ### UI

            - **Quote instead of "ask about this".** Selecting text now inserts a block quote at the cursor, with no scaffold text.
            - **"New session from this message"** carries the message text and images into the new composer.
            - **Favicon unread badge**: amber while a session waits for input, blue for unread completions, with a count collected while the window is hidden.
            - **Standalone renderers**: SVG fences preview like Mermaid (an `<img>` only — source never enters the DOM), inline audio/video playback, copy-LaTeX on display math, a diff preview of an edit before it is applied, structured tool-argument rows instead of raw JSON, per-turn durations, and a virtualized CSV/TSV table view.

            ### Fixes

            - **Skill market, six defects.** The installed tab no longer crashes on minimal metadata; infinite scroll no longer sticks after a filter change mid-page; 429 responses are no longer recorded as healthy; installs lock by owner and uninstall takes the same lock; file previews validate both the `path` shape and the skill's file list; compaction model choices filter to stored credentials.
            - **Teams stop what they list.** Stop / reclaim / ended / quota now include plan-only members; a corrupt `plan.json` answers 400 with a reason instead of "no plan yet"; resend validates the assignment state instead of delivering a duplicate; a failed `team_create` is no longer recorded against the lead session.
            - **MCP sign-in on pi 1.5.2.** The SDK store's refresh lock is forwarded, and project trust follows the pi 1.5 semantics.

            Bundled components: pi 1.5.2, pi-web 0.10.0 (the fork's pinned base; this build carries the upstream v0.10 → v0.17 changes).

            ---

            ## Pi Agent Desktop 0.8.3（fork）

            这是 pi-agent-desktop 的 **ojbkxc fork**，基于上游 0.8.2 构建。本版包含：上游 pi-web v0.10 至 v0.17 的安全 / 稳定性 / 性能吸收、pi SDK 1.5.2 / Next.js 16.4.4 / undici 8.12.3 升级，以及本 fork 的新增功能。

            ### 安全（上游 v0.10 → v0.17 移植）

            - **preview 模式绕过已封堵。** 每个发行版都带同一个 `previewModeId`，请求头 `x-prerender-revalidate` 与之相等时 Next 会跳过 `proxy.ts` —— 即绕过 web 密码门与 Host/Origin 校验（腾讯玄武实验室报告）。npm CLI 启动时轮换三个 preview 密钥；桌面启动器在 Next 之前剥掉两个 revalidate 请求头，并在每次启动时把密钥重写为新的随机值，因此即使剥头被绕过，发行版里的旧值也已失效。
            - **PowerShell 与 bash 同口径消毒。** PowerShell stand-in 会剥离 `PORT`、`NODE_ENV`、`NEXT_*`、`PI_WEB_PASSWORD`、`PI_DESKTOP_API_TOKEN`，只在被点名时激活，也不再顶掉用户扩展；bash stand-in 同样改为显式激活。
            - **npx 不再继承主机密钥。** 技能安装 / 搜索 / 更新在运行第三方 npm 代码前剥离主机环境变量。
            - **信任链归于正确的会话。** 子代理会话按父会话决定项目信任（只读一次，不写 trust.json），恢复的会话按自身目录决定，未信任目录里的子代理 profile 不再出现，未信任仓库的 `enabledModels` 也不再遮蔽全局列表。
            - **文件边界更紧。** git/diff 端点逐级 `lstat`（防 junction 逃逸）；上传走同盘暂存、两次拒符号链接、原子替换；无界后缀 Range 返回 416；MIME 查表只认自有属性。桌面 popup 按 nonce 清理，代理凭据不再随环境变量泄漏给子进程，技能市场外链只渲染 `http(s)`。

            ### 稳定性

            - **`session_start` 弹对话框的会话现在能正常启动**，不再在首轮之前死锁。
            - **登录流断线不崩。** 设备码 SSE 流对已关闭的 controller 加了守卫，pi SDK 在启动时预导入，ChatGPT OAuth 的 device id 修正。
            - **Code mode 不因一次启动卡顿被整个进程关掉。**
            - **补齐剩余的在途回合失效路径守卫**，快速切换会话不会把旧回复写进新对话。
            - **隧道探针固定直连**，与 `cloudflared` 自身的出网路径一致 —— 手动代理坏掉时不会再被误判成「隧道坏了」而拆掉一条本来通的隧道。

            ### 性能

            - **流式只重渲染回复本身。** 流式状态移出 React：每个 chunk 只重渲染 `StreamingReply`，不再带动整个窗口；整段流就是一个代码围栏时完全跳过 markdown 解析器。
            - **会话列表只重扫文件尾部**，不再从文件头读起。
            - **provider 签名不再下发浏览器**，长会话载荷更小。
            - **共享 model runtime。** provider 与扩展目录只加载一次（带 TTL），不再按 provider / skills 请求重建。

            ### 依赖

            - pi SDK **1.5.2**（8 个 `@earendil-works/*` 包精确锁）、Next.js **16.4.4**、undici **8.12.3**（修复 9 个安全通告）。`npm audit --omit=dev` 零漏洞。

            ### 新增

            - **自动修 Bug。** 给一句话任务说明：独立会话改代码，每轮回合结束后由引擎自己跑项目的验证命令（test → typecheck → check → lint，没有判据的任务拒绝启动）。exit 0 才算成功；失败输出喂回下一轮，轮次上限默认 20，进度原子落盘，重启后自动接续。
            - **挂机保活。** 15 秒心跳、按 pid 活性接续中断的会话（pid 还活着就永不判为孤儿），跨平台守护脚本（`scripts/pi-supervisor.mjs`：Windows 计划任务 / launchd / systemd user timer），重启预算 5 次/小时，断网时只等待不重启。设置 › 通用 › 挂机保活。
            - **Cloudflare 命名隧道绑定固定域名。** 注册后轮询 cloudflared 推送的 ingress 规则；自定义域名指向本机网关即自动绑定，无需重启隧道；固定公网地址可复制 / 打开。公网校验按 0 / 2 / 4 / 8 / 15 秒节奏重试，预算 45 秒。
            - **web 密码可存于设置。** 除 `PI_WEB_PASSWORD`（仍然优先）外，密码也能以 scrypt 哈希存进 0600 文件，绝不明文。改密即轮换会话令牌，旧会话全部失效。设置 › 通用 › 服务器。
            - **cc-haha 计划控制。** 带 parentPlan 的计划卡显示停止按钮；RuntimeControls 增加暂停 / 恢复与成员模型、推理级别编辑（运行中的成员改配置返回 409）。

            ### 界面

            - **「引用」替代「关于这段内容」。** 选中文字后在光标处插入块引用，不再带脚手架文字。
            - **「另开新会话」** 把该消息的文字与图片带进新会话输入框。
            - **favicon 未读徽标**：等待输入为琥珀色，未读完成为蓝色，窗口隐藏期间累计计数。
            - **独立渲染组件**：SVG 围栏像 Mermaid 一样预览（只挂 img，源码不进 DOM）、音视频内联播放、公式一键复制 LaTeX、编辑落盘前的 diff 预览、结构化工具参数行（不再是一坨 JSON）、每轮耗时、CSV/TSV 虚拟化表格视图。

            ### 修复

            - **技能市场六项缺陷。** 已安装页签不再因元数据缺失崩溃；翻页途中改筛选不再永久卡死；429 不再记成健康；安装锁按 owner 区分，卸载取同一把锁；文件预览同时校验 `path` 形状与技能文件清单；compaction 模型候选只保留已存凭据的模型。
            - **团队停止要停全。** 停止 / 回收 / 结束判定 / 配额都补上计划独有成员；`plan.json` 损坏明确返回 400 而不是「尚无计划」；重发前校验 assignment 状态，不再重复投递；`team_create` 失败结果不再记到 lead 会话名下。
            - **MCP 登录适配 pi 1.5.2。** 转发 SDK store 的 refresh lock，项目信任语义与 pi 1.5 对齐。

            内置组件版本：pi 1.5.2、pi-web 0.10.0（fork 钉住的基线版本；本构建已携带上游 v0.10 → v0.17 的变更）。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out pi-agent-desktop
        uses: actions/checkout@v7

      - name: Upload component manifest to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./src-tauri/pi-agent-desktop-package.json').version")"
          gh release upload "v$version" src-tauri/resources/component-versions.json --clobber
          # A prerelease is never served by the updater. Say so explicitly
          # instead of relying on the value tauri-action used when it first
          # created the draft (v0.7.3 ended up marked prerelease).
          gh release edit "v$version" --draft=false --latest --prerelease=false

  # A partially failed matrix leaves the release a draft and skips `manifest`,
  # which is correct — but it was also completely silent. Four consecutive
  # v0.1.3 builds failed on Windows without anyone noticing, and the release was
  # published by hand with macOS artifacts only and no component manifest.
  notify:
    needs: [build, manifest]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # This repository currently has Issues disabled, so an issue-only alert
      # silently fails and reports nothing — which is how four consecutive
      # failed releases went unnoticed. The job summary always works; the issue
      # is attempted on top and starts working by itself if Issues are enabled.
      - name: Report the failed release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "## Signed release build failed"
            echo
            echo "[Run log]($RUN_URL)"
            echo
            echo "The release for this version stays a **draft** and has no"
            echo "\`component-versions.json\`: the manifest job only runs when every"
            echo "platform in the build matrix succeeds."
            echo
            echo "**Do not publish it by hand.** A release missing a platform's installer"
            echo "or its component manifest will not serve updates to that platform —"
            echo "that is exactly how v0.1.3 shipped macOS-only."
          } >> "$GITHUB_STEP_SUMMARY"

          issues_enabled="$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues 2>/dev/null || echo false)"
          if [ "$issues_enabled" != "true" ]; then
            echo "Issues are disabled for $GITHUB_REPOSITORY; reported in the job summary only."
            echo "Enable Issues to also get a persistent, notifying alert." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --state open --label release-failure --limit 1 --json number --jq '.[0].number // empty')"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Release build failed again: $RUN_URL"
          else
            gh label create release-failure --repo "$GITHUB_REPOSITORY" \
              --color B60205 --description "Signed desktop release build needs attention" 2>/dev/null || true
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Signed release build failed" \
              --label release-failure \
              --body "The signed desktop release build failed: $RUN_URL

          The release for this version stays a DRAFT and has no component-versions.json,
          because the manifest job only runs when every platform in the build matrix
          succeeds. Do not publish it by hand — a release missing a platform's installer
          or its component manifest will not serve updates to that platform.

          This issue is reused for subsequent failures; close it once a release is green."
          fi

  # Keeps Casks/pi-agent.rb (the Homebrew tap: `brew tap abcwyc/pi-agent-desktop
  # https://github.com/abcwyc/pi-agent-desktop`) on the release that was just
  # published. Runs only after `manifest` has published it, so a draft or partly
  # failed release never reaches Homebrew users. Placed after `notify` because
  # release-workflows.test.mjs slices the manifest job up to `notify:`.
  homebrew:
    needs: manifest
    # The cask lives in the upstream's own Homebrew tap: its url/homepage point at
    # abcwyc/pi-agent-desktop, so a fork running this job would rewrite
    # Casks/pi-agent.rb to a version the upstream has never released and then push
    # that broken cask to main.
    if: github.repository == 'abcwyc/pi-agent-desktop'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pi-agent-desktop
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Point the cask at the published DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./src-tauri/pi-agent-desktop-package.json').version")"
          digest="$(gh release view "v$version" --json assets \
            --jq '.assets[] | select(.name | endswith("_aarch64.dmg")) | .digest')"
          if [ -z "$digest" ]; then
            echo "No aarch64 DMG digest on release v$version" >&2
            exit 1
          fi
          node scripts/update-homebrew-cask.mjs "$version" "$digest"
          if git diff --quiet -- Casks; then
            echo "Cask already at $version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/pi-agent.rb
          git commit -m "chore(homebrew): update cask to $version"
          git push origin HEAD:main
